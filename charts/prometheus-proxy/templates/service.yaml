apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-proxy.fullname" . }}
  labels:
    {{- include "prometheus-proxy.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "prometheus-proxy.selectorLabels" . | nindent 4 }}
  ports:
    # Prometheus scrapes each agent path here.
    - name: http
      port: {{ .Values.httpPort }}
      targetPort: http
    # Agents inside the cluster connect here; agents outside it use agentService.
    - name: grpc
      port: {{ .Values.agentPort }}
      targetPort: grpc
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
{{- if .Values.agentService.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "prometheus-proxy.fullname" . }}-agents
  labels:
    {{- include "prometheus-proxy.labels" . | nindent 4 }}
  {{- with .Values.agentService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.agentService.type }}
  {{- with .Values.agentService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    {{- include "prometheus-proxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.agentPort }}
      targetPort: grpc
{{- end }}
