# The values `helm upgrade --reuse-values --set dashboard.enabled=true` renders this chart with after a release of the
# 4.6.0 chart, which had no dashboard at all (a null deletes a key), as the README's upgrade does. The templates take
# each missing value's default; reading dashboard.login failed the upgrade, and the port was left empty.
proxy:
  hostname: proxy.example.com:50051
dashboard:
  enabled: true
  port: null
  host: null
  login: null
