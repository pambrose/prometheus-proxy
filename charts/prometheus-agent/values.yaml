# Default values for the prometheus-agent chart.

image:
  repository: pambrose/prometheus-agent
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# More than one replica registers the same paths from each pod, which the proxy accepts only when config sets
# agent.consolidated = true.
replicaCount: 1

proxy:
  # Required. The proxy's gRPC address as host:port (PROXY_HOSTNAME). A comma-separated list is tried in order, for
  # failover between proxies.
  hostname: ""

# Agent configuration in HOCON (AGENT_CONFIG): above all, the paths the agent registers and the targets behind them.
# See https://pambrose.github.io/prometheus-proxy/configuration/agent/
config: |
  agent {
    pathConfigs: [
      # { name: "My app", path: my_app_metrics, url: "http://my-app.default.svc.cluster.local:8080/metrics" }
    ]
  }

# The name of an existing ConfigMap with an agent.conf key, used instead of config.
existingConfigMap: ""

# Dynamic target discovery: the agent re-reads a paths list from its own ConfigMap on an interval, so targets can
# change without restarting it, and without touching the main config. See
# https://pambrose.github.io/prometheus-proxy/kubernetes/#updating-targets-without-restarting-the-agent
discovery:
  enabled: false
  # A HOCON paths list, rendered into this chart's discovery ConfigMap.
  targets: ""
  #  paths = [
  #    { name = "app1", path = "app1_metrics", url = "http://app1.default.svc.cluster.local:9090/metrics" }
  #  ]
  # The name of an existing ConfigMap with a targets.conf key, used instead of targets.
  existingConfigMap: ""
  reconcileIntervalSecs: 30

# The shared agent token (AGENT_TOKEN), read from an existing Secret; it must match the proxy's.
agentToken:
  existingSecret: ""
  key: token

# TLS for the connection to the proxy, from an existing Secret mounted at /app/certs. caFile verifies the proxy's
# certificate; certFile and keyFile add a client certificate, for mutual TLS.
tls:
  secretName: ""
  caFile: ca.pem
  certFile: ""
  keyFile: ""
  # The name to check the proxy's certificate against, when it differs from proxy.hostname (OVERRIDE_AUTHORITY).
  overrideAuthority: ""

# The admin endpoints (/ping, /healthcheck, /version, /threaddump). The probes use them, so leave them on unless you
# replace the probes.
admin:
  enabled: true
  port: 8093

# The agent's own metrics, on the Service's metrics port.
metrics:
  enabled: true
  port: 8083

# A Service exposing the metrics port, for Prometheus to scrape the agent itself.
service:
  enabled: true
  type: ClusterIP
  annotations: {}

# A Prometheus Operator ServiceMonitor for the agent's own metrics.
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s

# Added to the JVM's options. The default sizes the heap from the container's memory limit.
javaToolOptions: "-XX:MaxRAMPercentage=75.0"

# Extra command-line arguments, for example -Dagent.scrapeTimeoutSecs=30.
extraArgs: []

# Extra environment variables, for example AGENT_NAME.
env: []
envFrom: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 15
readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 15

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

# The root filesystem is read-only; /tmp is an emptyDir, where the JVM and Netty write their temporary files.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ ALL ]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
extraVolumes: []
extraVolumeMounts: []
