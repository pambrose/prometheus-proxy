server {
  # 50440 is the agent.proxy.port value
  listen 50440;
  # gRPC needs HTTP/2. The http2 directive replaces the "listen ... http2" parameter, deprecated since nginx 1.25.1.
  http2 on;

  # An agent's connection ends when any of its streams closes, and nginx closes a stream that's quiet for 60 seconds.
  # A current agent and proxy send keepalives every 30 seconds, but an agent or a proxy from 4.6.0 or earlier sends
  # nothing on a stream between messages, and its stream for chunked results carries none while its results are
  # small, so this raises client_body_timeout, for the streams the agent sends scrape results on, and
  # grpc_read_timeout below, for the ones the proxy sends on: scrape requests, and path notices. With the defaults,
  # such an agent reconnects every minute, scraped or not.
  client_body_timeout 1d;

  # nginx counts all an agent sends on a stream as one request body, and an agent's streams of results stay open while
  # it's connected, so the default limit, 1 MB, would end one with 413 once its results added up to a megabyte, and
  # the agent would reconnect. Every agent needs this, whatever its version.
  client_max_body_size 0;

  location / {
    # The nginx gRPC options: https://nginx.org/en/docs/http/ngx_http_grpc_module.html
    # 50051 is the proxy.agent.port value
    grpc_pass grpc://alta.lan:50051;
    grpc_read_timeout 1d;
    grpc_socket_keepalive on;
  }
}
