server {
  # 50440 is the agent.proxy.port value
  listen 50440;
  # gRPC needs HTTP/2. The http2 directive replaces the "listen ... http2" parameter, deprecated since nginx 1.25.1.
  http2 on;

  # An agent's streams carry nothing between scrapes, and its connection ends when any of them closes. nginx closes a
  # stream that's quiet for 60 seconds, so this raises client_body_timeout, for the streams the agent sends scrape
  # results on, and grpc_read_timeout below, for the one the proxy sends scrape requests on. With the defaults, an agent
  # scraped less often than once a minute reconnects every minute.
  client_body_timeout 1d;

  location / {
    # The nginx gRPC options: https://nginx.org/en/docs/http/ngx_http_grpc_module.html
    # 50051 is the proxy.agent.port value
    grpc_pass grpc://alta.lan:50051;
    grpc_read_timeout 1d;
    grpc_socket_keepalive on;
  }
}
