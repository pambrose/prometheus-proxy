agent {
  // The agent's own metrics, served at this path through the proxy, in-process, with no port.
  metrics.proxyPath = agent_metrics

  pathConfigs: [
    {
      name: "Federate metrics"
      path: federate_metrics
      url: "http://prometheus:9090/federate?match[]={job=~'.*'}"
    }
  ]
}
