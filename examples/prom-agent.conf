// The proxy's host for its metrics, as in simple.conf: PROXY_HOSTNAME when
// it's set, as when the agent runs in its own container, so a host name
// without a port, and localhost otherwise.
proxyMetricsHost = localhost
proxyMetricsHost = ${?PROXY_HOSTNAME}

proxy {
  admin.debugEnabled = true

  admin.enabled: true
  metrics.enabled: true

  #transportFilterDisabled = true

  http.requestLoggingEnabled: true
}

agent {
  //scrapeTimeoutSecs = 16

  proxy.hostname = localhost
  admin.enabled: true

  // The agent's own metrics, served at this path through the proxy, in-process.
  metrics.proxyPath = agent_metrics
  // The metrics port stays on too, so you can curl localhost:8083/metrics directly while debugging.
  metrics.enabled: true

  #transportFilterDisabled = true

  pathConfigs: [
    {
      name: "Proxy metrics"
      path: proxy_metrics
      url: "http://"${proxyMetricsHost}":8082/metrics"
    }
  ]
}
