// The proxy and the agent monitor themselves: the agent serves the proxy's and its own metrics through the proxy, at
// /proxy_metrics and /agent_metrics.
//
// On one host, run both with --config examples/simple.conf. In Docker, an agent's localhost is its own container, so
// the Docker quick start puts the two containers on one network and gives the agent PROXY_HOSTNAME, the proxy
// container's name: the agent connects to the proxy there, and fetches the proxy's metrics from there too.

// The proxy's host for its metrics: PROXY_HOSTNAME when it's set, so a host name without a port, and localhost
// otherwise. The agent's own metrics are on its localhost wherever it runs.
proxyMetricsHost = localhost
proxyMetricsHost = ${?PROXY_HOSTNAME}

proxy {
  admin.debugEnabled = false

  admin.enabled: true
  metrics.enabled: true

  http.requestLoggingEnabled: true
}

agent {
  proxy.hostname = localhost
  admin.enabled: true
  metrics.enabled: true

  pathConfigs: [
    {
      name: "Proxy metrics"
      path: proxy_metrics
      labels: "{\"key1\": \"value1\", \"key2\": \"2\"}"
      url: "http://"${proxyMetricsHost}":8082/metrics"
    }
    {
      name: "Agent metrics"
      path: agent_metrics
      labels: "{\"key3\": \"value3\", \"key4\": \"4\"}"
      url: "http://localhost:8083/metrics"
    }
  ]
}
