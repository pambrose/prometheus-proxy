// A proxy that agents embedded in cloud apps connect to. Its certificate, key, and the agents' token come from the
// environment (CERT_CHAIN_PEM, PRIVATE_KEY_PEM, AGENT_TOKEN), so this file holds no secret. The setup is described at
// https://pambrose.github.io/prometheus-proxy/cloud-platforms/
proxy {
  // Prometheus scrapes the apps' metrics here. Keep it off the internet: anyone who reaches it scrapes through the
  // agents
  http.port = 8080

  // The agents connect here, over TLS and with the token: the one port to open to the internet
  agent.port = 50051

  // The proxy's own metrics, which Prometheus scrapes too: how many agents are connected, and how their scrapes go
  metrics {
    enabled = true
    port = 8082
  }
}
