# The docs site's Spring Boot Starter page shows this file from here to its end marker, and StarterExamplesTest binds
# it, so the page's property names are the starter's.
# --8<-- [start:starter-yaml]
spring:
  application:
    name: roastery

prometheus-proxy:
  agent:
    # Unset, as on a developer's machine, the agent stays off
    proxy: ${PROMETHEUS_PROXY:}
    token: ${PROMETHEUS_AGENT_TOKEN:}
    # The certificate the proxy's is signed with, and the name the proxy's certificate was issued to: without
    # PROMETHEUS_PROXY_AUTHORITY, prometheus-proxy, as fromEnvironment() has it, the name Cloud Platforms issues it to
    trust-certificate: ${PROMETHEUS_PROXY_CERT:}
    authority: ${PROMETHEUS_PROXY_AUTHORITY:prometheus-proxy}
    # How long the agent's stop may hold up the app's shutdown: inside the platform's window after SIGTERM, such as
    # Cloud Run's 10 seconds
    stop-timeout: 8s
# --8<-- [end:starter-yaml]
