\* Reconnect model, the full check's alone (make tla-checks-full): the reclaim model with three connections, so an agent
\* told its path was taken over can reconnect, as two connections of one launch, while an agent of another launch holds
\* the path, and takes it back only once the path is free, on the connection it reconnected with. Exclusive connections
\* only, as consolidated ones are never told and never reclaim, which cuts the states several times over. No scrapes:
\* the notices and reclaims never touch them.
CONSTANTS
    Conns = {c1, c2, c3}
    Paths = {p1}
    Identities = {i1}
    Launches = {l1, l2}
    Modes = {FALSE}
    Scrapes = {}
    NoConn = NoConn
    UseTimeout = FALSE
    CheckOwnership = TRUE
    SameLookup = TRUE
    StreamSameLookup = TRUE
    UseReclaim = TRUE
    CheckHolder = TRUE
    KeepTold = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExclusivePathHasOneAgent
    NoStrandedPath
    PathCountsAgree
    IdentityIsolation
    ModesNeverMix
    StreamIdentity
    InvalidatedHasNoNotices

PROPERTIES
    ReclaimNeverDisplaces
    DisplacedReclaims
    ReconnectReclaims
