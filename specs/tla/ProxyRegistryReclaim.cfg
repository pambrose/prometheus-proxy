\* Reclaim model: two connections of the one identity on one exclusive path, with path notices on, so the later
\* registration takes the path, the proxy tells the agent it displaced, and that agent takes it back only once the path
\* is free. No scrapes: the notices and reclaims never touch them.
CONSTANTS
    Conns = {c1, c2}
    Paths = {p1}
    Identities = {i1}
    Launches = {l1, l2}
    Scrapes = {}
    NoConn = NoConn
    UseTimeout = FALSE
    CheckOwnership = TRUE
    SameLookup = TRUE
    StreamSameLookup = TRUE
    UseReclaim = TRUE
    CheckHolder = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExclusivePathHasOneAgent
    NoStrandedPath
    PathCountsAgree
    IdentityIsolation
    ModesNeverMix
    StreamIdentity

PROPERTIES
    ReclaimNeverDisplaces
    DisplacedReclaims
