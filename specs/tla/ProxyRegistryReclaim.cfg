\* Reclaim model: three connections of the one identity on one exclusive path, with path notices on, so the later
\* registration takes the path, the proxy tells the agent it displaced, and that agent takes it back only once the path
\* is free, on the connection it was told on or, as two connections of one launch, one it reconnects with. No scrapes:
\* the notices and reclaims never touch them.
CONSTANTS
    Conns = {c1, c2, c3}
    Paths = {p1}
    Identities = {i1}
    Launches = {l1, l2}
    Modes = {FALSE}
    Scrapes = {}
    NoConn = NoConn
    UseTimeout = FALSE
    CheckOwnership = TRUE
    SameLookup = TRUE
    StreamSameLookup = TRUE
    UseReclaim = TRUE
    CheckHolder = TRUE
    KeepTold = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExclusivePathHasOneAgent
    NoStrandedPath
    PathCountsAgree
    IdentityIsolation
    ModesNeverMix
    StreamIdentity

PROPERTIES
    ReclaimNeverDisplaces
    DisplacedReclaims
    ReconnectReclaims
