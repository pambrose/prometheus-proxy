\* Reclaim model: two connections of the one identity on one path, consolidated or not, with path notices on, so a
\* later exclusive registration takes the path, the proxy tells the agent it displaced, and that agent takes it back
\* only once the path is free. ProxyRegistryReconnect.cfg adds the third connection a reconnect needs, and checks
\* ReconnectReclaims, which holds trivially with two. No scrapes: the notices and reclaims never touch them.
CONSTANTS
    Conns = {c1, c2}
    Paths = {p1}
    Identities = {i1}
    Launches = {l1, l2}
    Modes = {TRUE, FALSE}
    Scrapes = {}
    NoConn = NoConn
    UseTimeout = FALSE
    CheckOwnership = TRUE
    SameLookup = TRUE
    StreamSameLookup = TRUE
    UseReclaim = TRUE
    CheckHolder = TRUE
    KeepTold = TRUE
    DropGone = TRUE
    RemoveOrphans = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExclusivePathHasOneAgent
    NoStrandedPath
    PathCountsAgree
    IdentityIsolation
    ModesNeverMix
    LabelsOfPathIdentity
    StreamIdentity
    InvalidatedHasNoNotices

PROPERTIES
    ReclaimNeverDisplaces
    DisplacedReclaims
