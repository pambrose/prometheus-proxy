\* Liveness model: with the handler timeout disabled, EveryScrapeFinishes shows no scrape waits on a request that
\* nobody will answer or fail. Two connections cover a disconnect racing a reconnect's registration and displacement.
CONSTANTS
    Conns = {c1, c2}
    Paths = {p1}
    Identities = {i1, i2}
    Launches = {l1, l2}
    Modes = {TRUE, FALSE}
    Scrapes = {s1}
    NoConn = NoConn
    UseTimeout = FALSE
    CheckOwnership = TRUE
    SameLookup = TRUE
    StreamSameLookup = TRUE
    UseReclaim = FALSE
    CheckHolder = TRUE
    KeepTold = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExclusivePathHasOneAgent
    NoStrandedPath
    PathCountsAgree
    IdentityIsolation
    AnswerFromOwner
    ModesNeverMix
    StreamIdentity
    InvalidatedHasNoNotices

PROPERTIES
    EveryScrapeFinishes
