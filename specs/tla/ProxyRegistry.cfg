\* Liveness model: with the handler timeout disabled, EveryScrapeFinishes shows no scrape waits on a request that
\* nobody will answer or fail. Two connections cover a disconnect racing a reconnect's registration and displacement.
CONSTANTS
    Conns = {c1, c2}
    Paths = {p1}
    Identities = {i1, i2}
    Scrapes = {s1}
    NoConn = NoConn
    UseTimeout = FALSE
    CheckOwnership = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExclusivePathHasOneAgent
    NoStrandedPath
    PathCountsAgree
    IdentityIsolation
    AnswerFromOwner
    ModesNeverMix

PROPERTIES
    EveryScrapeFinishes
