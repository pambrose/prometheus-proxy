\* Safety model: three connections, two paths, two scrapes, and the handler timeout on. Invariants only; TLC's
\* liveness check does not scale to this size.
CONSTANTS
    Conns = {c1, c2, c3}
    Paths = {p1, p2}
    Identities = {i1, i2}
    Scrapes = {s1, s2}
    NoConn = NoConn
    UseTimeout = TRUE
    CheckOwnership = TRUE

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ExclusivePathHasOneAgent
    NoStrandedPath
    PathCountsAgree
    IdentityIsolation
    AnswerFromOwner
    ModesNeverMix
