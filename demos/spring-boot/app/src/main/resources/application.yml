spring:
  application:
    # The starter names the agent after it and the build's version, roastery-1.0, and serves the app's metrics at the
    # proxy's /roastery_metrics
    name: roastery
  # How long Spring Boot's graceful shutdown waits for each phase, the agent's among them
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  # The health components' details, the agent's among them (the starter's prometheusAgent); the demo publishes the app
  # on 127.0.0.1 only. Actuator exposes only health over HTTP, its default: the agent reads the metrics registry
  # in-process, so /actuator/prometheus needn't be exposed.
  endpoint:
    health:
      show-details: always

logging:
  level:
    # gRPC's internal logging, as the standalone agent sets it (see the docs site's Embedded Agent page)
    io.grpc.internal: WARN

# The website's Spring Boot Demo page shows the agent's settings from here to the end marker.
# --8<-- [start:agent-settings]
# The embedded agent's settings, which the Spring Boot starter binds, from the environment the coffee shop and the docs
# site's Cloud Platforms page use. Without PROMETHEUS_PROXY, as on a developer's machine, the agent stays off.
prometheus-proxy:
  agent:
    proxy: ${PROMETHEUS_PROXY:}
    token: ${PROMETHEUS_AGENT_TOKEN:}
    # The certificate the proxy's is signed with, as PEM or its base64, and the name the proxy's certificate was issued
    # to: without PROMETHEUS_PROXY_AUTHORITY, prometheus-proxy, as fromEnvironment() has it, the name the docs site's
    # Cloud Platforms page issues it to. For a certificate issued to the host the agent connects to, as a public CA's
    # is, set PROMETHEUS_PROXY_AUTHORITY to that host. The demo's compose file sets it to its test certificate's name.
    trust-certificate: ${PROMETHEUS_PROXY_CERT:}
    authority: ${PROMETHEUS_PROXY_AUTHORITY:prometheus-proxy}
# --8<-- [end:agent-settings]
