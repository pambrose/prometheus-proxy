spring:
  application:
    name: roastery
  # How long Spring Boot's graceful shutdown waits for each phase, the agent's among them
  lifecycle:
    timeout-per-shutdown-phase: 10s

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus

logging:
  level:
    # gRPC's internal logging, as the standalone agent sets it (see the docs site's Embedded Agent page)
    io.grpc.internal: WARN

# The embedded agent's settings (AgentSettings), from the environment the coffee shop and the docs site's Cloud
# Platforms page use. Without PROMETHEUS_PROXY, as on a developer's machine, the agent stays off.
roastery:
  monitoring:
    proxy-endpoint: ${PROMETHEUS_PROXY:}
    token: ${PROMETHEUS_AGENT_TOKEN:}
    certificate: ${PROMETHEUS_PROXY_CERT:}
    authority: ${PROMETHEUS_PROXY_AUTHORITY:prometheus-proxy}
    metrics-user: ${METRICS_USER:}
    metrics-password: ${METRICS_PASSWORD:}
