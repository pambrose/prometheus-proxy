# The Spring Boot demo (../README.md): the roastery, a Spring Boot app with the prometheus-proxy agent embedded, the
# stock proxy, and Prometheus. demo.sh starts it, and writes .env beside this file, which compose reads: the proxy's TLS
# certificate and key, the CA certificate the agent trusts, the agent's token, and the password for Actuator's
# /actuator/prometheus. Every port is published on 127.0.0.1 only.
name: prometheus-proxy-spring-boot-demo

services:
  roastery:
    image: prometheus-proxy-demo/spring-boot-app:local
    build:
      context: ../app
      args:
        APP_BUILD: ${SPRING_BOOT_DEMO_APP_BUILD:-compiled}
        PROXY_VERSION: ${SPRING_BOOT_DEMO_PROXY_VERSION:-}
    # The settings the roastery's AgentSettings binds, through application.yml
    environment:
      PROMETHEUS_PROXY: proxy:50051
      PROMETHEUS_AGENT_TOKEN: ${AGENT_TOKEN:-}
      PROMETHEUS_PROXY_CERT: ${PROXY_CA_PEM:-}
      # The name the test certificate (testing/certs/server1.pem) was issued to
      PROMETHEUS_PROXY_AUTHORITY: foo.test.google.fr
      METRICS_USER: ${METRICS_USER:-}
      METRICS_PASSWORD: ${METRICS_PASSWORD:-}
      # The agent's own dashboard, which the agent turns on from its environment, over what the roastery's code sets,
      # so the code needs no change. It has no password, so the agent warns at startup that it listens on every
      # interface without a login: the container's, whose port is published on 127.0.0.1 only.
      DASHBOARD_ENABLED: "true"
      DASHBOARD_PORT: "8495"
    ports:
      - "127.0.0.1:${SPRING_BOOT_DEMO_APP_PORT:-8490}:8080"  # The status page and Actuator, for curl
      - "127.0.0.1:${SPRING_BOOT_DEMO_AGENT_DASHBOARD_PORT:-8495}:8495"  # The agent's dashboard
    depends_on:
      proxy:
        condition: service_started
    # Long enough for Spring Boot's graceful shutdown, which stops the agent first
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
      interval: 2s
      timeout: 2s
      retries: 60
    restart: on-failure

  proxy:
    image: prometheus-proxy-demo/proxy:local
    build:
      context: ../../..
      dockerfile: etc/docker/proxy.Dockerfile
    hostname: proxy
    environment:
      PROXY_CONFIG: /app/proxy.conf
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      CERT_CHAIN_PEM: ${CERT_CHAIN_PEM:-}
      PRIVATE_KEY_PEM: ${PRIVATE_KEY_PEM:-}
    volumes:
      - ../config/proxy.conf:/app/proxy.conf:ro
    ports:
      - "127.0.0.1:${SPRING_BOOT_DEMO_DASHBOARD_PORT:-8494}:8094"  # Dashboard
      - "127.0.0.1:${SPRING_BOOT_DEMO_PROXY_PORT:-8480}:8080"      # Scrape port: the roastery's path, for curl
    restart: on-failure

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${SPRING_BOOT_DEMO_PROMETHEUS_PORT:-9490}:9090"
    depends_on:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: on-failure
