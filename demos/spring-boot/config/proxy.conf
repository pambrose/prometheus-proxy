// Proxy config for the Spring Boot demo (demos/spring-boot/docker/compose.yml). Its TLS certificate and key, and the
// token the roastery's agent presents, come from the environment (CERT_CHAIN_PEM, PRIVATE_KEY_PEM, AGENT_TOKEN), which
// demo.sh writes to docker/.env, so this file holds no secret. Every key here is checked against config/config.conf by
// ConfigFileKeysTest.

proxy {
  // The proxy's own metrics, which Prometheus scrapes on the compose network.
  metrics.enabled = true

  // The dashboard, on 127.0.0.1 only (compose.yml): it has no authentication, so on a cloud host it stays off.
  dashboard {
    enabled = true
    refreshIntervalSecs = 1

    // The screens the proxy's screens page, /screens, shows beside this dashboard, each in a tab: the roastery's
    // status page, its agent's dashboard, and Prometheus on its graph of the batches roasted in the last minute, by
    // origin. Each url is the address a browser on this machine reaches the screen by, then the one compose gives the
    // proxy (SPRING_BOOT_DEMO_*_URL), which follows a port moved with SPRING_BOOT_DEMO_*_PORT.
    screens = [
      { name = "roastery", url = "http://localhost:8490", url = ${?SPRING_BOOT_DEMO_APP_URL} }
      { name = "agent", url = "http://localhost:8495/dashboard", url = ${?SPRING_BOOT_DEMO_AGENT_URL} }
      {
        name = "Prometheus"
        url = "http://localhost:9490"
        url = ${?SPRING_BOOT_DEMO_PROMETHEUS_URL}
        start = "/query?g0.tab=graph&g0.expr=increase(roastery_batches_roasted_total[1m])"
      }
    ]
  }
}
