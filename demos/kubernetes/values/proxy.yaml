# Values for the prometheus-proxy chart (charts/prometheus-proxy) in pp-monitoring. demo.sh installs it as the
# prometheus-proxy release in the monitoring namespace, with --set-file config=config/proxy.conf, and an annotation
# naming the image's ID, so a rebuilt image replaces the pod.

image:
  # Built from this checkout's proxy jar (etc/docker/proxy.Dockerfile), shared with the other demos, and loaded into
  # the cluster with `kind load docker-image`, so the node never pulls it.
  repository: prometheus-proxy-demo/proxy
  tag: local
  pullPolicy: Never

# The token every agent must present, from the agent-token Secret demo.sh creates in both clusters.
agentToken:
  existingSecret: agent-token

# The chart leaves the dashboard's port out of its Service; the demo's own NodePort Service, proxy-dashboard
# (k8s/monitoring.yaml), publishes it.
dashboard:
  enabled: true

# The gRPC port, for the agent in the other cluster: kind has no load balancer, so a NodePort on this cluster's node,
# which the agent reaches across Docker's kind network. demo.sh reads its port and hands it to the agent chart.
agentService:
  enabled: true
  type: NodePort
