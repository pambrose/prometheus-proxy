# Values for the prometheus-proxy chart (charts/prometheus-proxy) in pp-monitoring. demo.sh installs it as the
# prometheus-proxy release in the monitoring namespace, with --set-file config=config/proxy.conf, and chooses the image:
# the chart's own, pambrose/prometheus-proxy, at the latest release (make up), or the one built from this checkout and
# loaded into the cluster, with an annotation naming its ID, so a rebuilt image replaces the pod (make up-local).

# The token every agent must present, from the agent-token Secret demo.sh creates in both clusters.
agentToken:
  existingSecret: agent-token

# The chart leaves the dashboard's port out of its Service; the demo's own NodePort Service, proxy-dashboard
# (k8s/monitoring.yaml), publishes it. A Service reaches the pod's address, not its loopback, where the chart has the
# dashboard listen, so here it listens on every interface, and the proxy logs a warning that it has no login. The
# NodePort is mapped to the laptop's 127.0.0.1 only (kind/pp-monitoring.yaml).
dashboard:
  enabled: true
  host: 0.0.0.0

# The gRPC port, for the agent in the other cluster: kind has no load balancer, so a NodePort on this cluster's node,
# which the agent reaches across Docker's kind network. demo.sh reads its port and hands it to the agent chart.
agentService:
  enabled: true
  type: NodePort
