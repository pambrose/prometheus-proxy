# Values for the prometheus-agent chart (charts/prometheus-agent) in pp-target. demo.sh installs it as the
# prometheus-agent release in the monitoring namespace, with --set-file config=config/agent.conf and the proxy's
# address (proxy.hostname, the pp-monitoring node's address and the proxy's gRPC NodePort), and chooses the image: the
# chart's own, pambrose/prometheus-agent, at the latest release (make up), or the one built from this checkout and
# loaded into the cluster, with an annotation naming its ID, so a rebuilt image replaces the pod (make up-local).

# The proxy's token, from the agent-token Secret demo.sh creates in both clusters.
agentToken:
  existingSecret: agent-token

# The services come from targets-sync, which writes them into agent-targets (k8s/agent-targets.yaml), a ConfigMap the
# demo owns rather than the chart, so a helm upgrade never puts back an old list. The agent re-reads it every 5
# seconds and registers or unregisters what changed, without restarting.
discovery:
  enabled: true
  existingConfigMap: agent-targets
  reconcileIntervalSecs: 5

# The agent's own dashboard, on the chart's port, 8095, in the agent's pod. The chart leaves it off the agent's Service,
# and pp-target maps no port to the host, so `demo.sh agent-dashboard` reaches it with kubectl port-forward. It runs
# without its login, as the proxy's does here, so the agent logs a warning about it at startup.
dashboard:
  enabled: true

# The agent's name is its pod's, so the proxy dashboard lists it under the name kubectl shows, and a replacement pod
# appears under its own.
env:
  - name: AGENT_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.name
