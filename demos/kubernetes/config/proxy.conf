// Proxy config for the Kubernetes demo (demos/kubernetes), which demo.sh passes to the prometheus-proxy chart with
// --set-file config=config/proxy.conf; the chart renders it into a ConfigMap and mounts it as PROXY_CONFIG. The chart
// sets the ports, and the agent token comes from the agent-token Secret (agentToken.existingSecret in
// values/proxy.yaml), so neither is here. Every key here is checked against config/config.conf by ConfigFileKeysTest.

proxy {
  // The chart sets these from its own values (admin.enabled, metrics.enabled, dashboard.enabled in
  // values/proxy.yaml), which take precedence over this file; they're here so the file reads whole.
  admin.enabled = true
  metrics.enabled = true

  dashboard {
    enabled = true
    // Push the values that drift (idle times, backlogs) every second rather than every two.
    refreshIntervalSecs = 1

    // A link from each path in the Paths view to its job in the demo's Prometheus, at the address a browser on this
    // machine reaches it by: the query is up{job="{label.job}"}, percent-encoded but for the placeholder. Moving
    // Prometheus with KUBERNETES_DEMO_PROMETHEUS_PORT leaves it at the default port.
    links = [
      {
        name = "Prometheus"
        url = "http://localhost:9290/query?g0.expr=up%7Bjob%3D%22{label.job}%22%7D"
        icon = "prometheus"
      }
    ]
  }

  // Prometheus finds every path the agent registers through /discovery, so its config names no target in pp-target.
  // targetPrefix is the proxy's scrape address as Prometheus reaches it in pp-monitoring: the chart's Service.
  service.discovery {
    enabled = true
    targetPrefix = "prometheus-proxy:8080"
  }
}
