// Part 5's change to the agent's main config (`demo.sh change-config`): demo.sh appends this file to agent.conf, where
// HOCON lets a later setting override an earlier one, and upgrades the prometheus-agent chart with the result. The
// chart's checksum/config annotation changes with the config, so Kubernetes replaces the agent's pod, stopping the old
// one first (the chart's strategy: Recreate). `demo.sh restore-config` installs agent.conf alone again.
//
// The change turns on the agent's JVM metrics, which its agent_metrics path then carries to Prometheus: the kind of
// operational tweak a platform team makes, and one that shows in Prometheus once the new pod is up.

agent.metrics {
  standardExportsEnabled = true
  memoryPoolsExportsEnabled = true
  garbageCollectorExportsEnabled = true
  threadExportsEnabled = true
}
