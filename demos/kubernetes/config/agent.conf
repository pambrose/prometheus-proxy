// Agent config for the Kubernetes demo (demos/kubernetes), which demo.sh passes to the prometheus-agent chart with
// --set-file config=config/agent.conf; the chart renders it into a ConfigMap, mounts it as AGENT_CONFIG, and restarts
// the agent when it changes (its checksum/config annotation). Every key here is checked against config/config.conf by
// ConfigFileKeysTest.
//
// What isn't here: the proxy's address, which demo.sh gives the chart (PROXY_HOSTNAME), since it's only known once
// pp-monitoring is up; the token, from the agent-token Secret (AGENT_TOKEN); the agent's name, its pod's
// (AGENT_NAME, from the downward API in values/agent.yaml); and the services it scrapes, which targets-sync writes
// into their own ConfigMap, agent-targets, which the agent re-reads every 5 seconds without restarting
// (discovery in values/agent.yaml).

agent {
  // Below Prometheus's 4s scrape timeout, so a hung target shows as the agent's upstream_timed_out (408).
  scrapeTimeoutSecs = 3
  // Scrape targets in parallel; with the default of 1, one slow target would hold up every other path.
  http.maxConcurrentClients = 4

  metrics.enabled = true

  // The one static path: the agent's own metrics, through its own link to the proxy. The services come from
  // discovery, so they appear on the dashboard as disc, this one as cfg.
  pathConfigs: [
    {
      name: "Agent metrics"
      path: agent_metrics
      labels: """{"job": "prometheus-agent"}"""
      url: "http://localhost:8083/metrics"
    }
  ]
}
