# Prometheus config for the Kubernetes demo (demos/kubernetes), in pp-monitoring. demo.sh creates the
# prometheus-config ConfigMap from it, and restarts Prometheus when it changes. `make check-rules`, from the repository
# root, validates it with promtool.
#
# It names no target in pp-target: its one job finds every path the agent registers, static or discovered, through the
# proxy's HTTP service discovery endpoint, and scrapes each through the proxy, at the chart's ClusterIP Service in its
# own namespace. A Service annotated in pp-target shows up here without a change to this file.

global:
  # Short intervals, so the dashboard and Prometheus move visibly during a demo.
  scrape_interval: 5s
  # Longer than the agent's 3s scrapeTimeoutSecs, so a hung target is reported by the agent, not cut off here.
  scrape_timeout: 4s
  evaluation_interval: 5s

scrape_configs:
  - job_name: proxy-discovered
    http_sd_configs:
      - url: http://prometheus-proxy:8080/discovery
        refresh_interval: 5s
    relabel_configs:
      # Each path's labels include a job (orders, search, prometheus-agent, ...), which replaces this scrape config's
      # job_name, since Prometheus applies job_name only to a target that has no job label. Keep the serving agent's
      # name, its pod's, as an `agent` label, and drop the host name, the same pod name again.
      - source_labels: [agentName]
        target_label: agent
      - action: labeldrop
        regex: agentName|hostName
