# The simulated services in pp-target (app/services_app.py, one service per pod), each with a ClusterIP Service in the
# apps namespace annotated prometheus-proxy/path, so targets-sync lists it in the agent's targets. demo.sh applies it
# with `kubectl --context kind-pp-target apply -f k8s/services.yaml`, and creates their script, the services-app
# ConfigMap, from app/services_app.py. Part 3's search service is in search.yaml.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: apps
  labels:
    app.kubernetes.io/name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: orders
          # The basics demo's Python image, digest included.
          image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
          command: ["python", "-u", "/app/services_app.py"]
          env:
            - name: SERVICE
              value: orders
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
      volumes:
        - name: app
          configMap:
            name: services-app
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: apps
  annotations:
    # targets-sync (sync/targets_sync.py) writes every Service with this annotation into the agent's targets.
    prometheus-proxy/path: orders_metrics
spec:
  # ClusterIP, the default: reachable inside pp-target only.
  selector:
    app.kubernetes.io/name: orders
  ports:
    - name: http
      port: 8000
      targetPort: http
---
