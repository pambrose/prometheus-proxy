// agent-hq: the agent at headquarters, inside the firewall. It scrapes two small services and its own metrics, and is
// the demo's steady reference: the scenarios that degrade one agent's links (far, thin, cut, flaky) leave its links
// alone unless they're given its name.
//
// Each path's labels carry a job, which Prometheus takes as the job label of everything scraped from that path,
// through the proxy's service discovery.

agent {
  name = "agent-hq"
  // Its two links through the simulated WAN (the wan service, Toxiproxy): to the primary proxy, then to the standby.
  // Each is a name and port of its own, so the dashboard's "via" line names the link the agent connected through.
  proxy.endpoints = ["hq-to-proxy:50051", "hq-to-standby:50052"]
  // The token in proxy.conf: a demo token in a public file, never to be reused.
  agentToken = "demo-network-token"

  // Below Prometheus's 4s scrape timeout, so a hung target shows as the agent's upstream_timed_out (408).
  scrapeTimeoutSecs = 3
  // Scrape targets in parallel; with the default of 1, one slow target would hold up every other path.
  http.maxConcurrentClients = 8

  metrics.enabled = true

  // A span for each gRPC call to the proxy, to the demo's Zipkin, under this agent's name.
  internal.zipkin {
    enabled = true
    hostname = "zipkin"
    serviceName = "agent-hq"
  }

  pathConfigs: [
    {
      name: "Agent metrics"
      path: agent_hq_metrics
      // The agent's own metrics, agent_connect_count_total among them, come through its link like any other path.
      labels: """{"job": "agent-hq", "site": "hq"}"""
      url: "http://localhost:8083/metrics"
    }
    {
      name: "Orders service"
      path: orders_metrics
      labels: """{"job": "orders", "site": "hq"}"""
      url: "http://network-app:8000/orders/metrics"
    }
    {
      name: "Payments service"
      path: payments_metrics
      labels: """{"job": "payments", "site": "hq"}"""
      url: "http://network-app:8000/payments/metrics"
    }
  ]
}
