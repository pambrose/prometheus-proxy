// Proxy config for the network demo (demos/network/docker/compose.yml). Every key here is checked against
// config/config.conf by ConfigFileKeysTest.

proxy {
  // The proxy's own metrics, which Prometheus scrapes directly, on the same side of the WAN, so it still sees the
  // proxies when every link is down.
  metrics.enabled = true
  admin.enabled = true

  dashboard {
    enabled = true
    // Push the values that drift (idle times, backlogs, the eviction countdown) every second rather than every two.
    refreshIntervalSecs = 1

    // Links from each path in the Paths view to its job in the demo's Prometheus and Grafana, at the addresses a
    // browser on this machine reaches them by. The Prometheus query is up{job="{label.job}"}, percent-encoded but for
    // the placeholder. Moving Prometheus or Grafana with NETWORK_DEMO_PROMETHEUS_PORT or NETWORK_DEMO_GRAFANA_PORT
    // leaves these at the default ports. The standby includes this file, so its dashboard has them too.
    links = [
      {
        name = "Prometheus"
        url = "http://localhost:9190/graph?g0.expr=up%7Bjob%3D%22{label.job}%22%7D"
        icon = "prometheus"
      }
      {
        name = "Grafana"
        url = "http://localhost:3100/d/prometheus-proxy-network-demo?var-job={label.job}"
        icon = "grafana"
      }
    ]
  }

  // One token every agent presents, since identities aren't this demo's story (the dashboard demo shows them). A demo
  // token in a public file: never reuse it.
  agentToken = "demo-network-token"

  // Prometheus finds every path an agent registers through /discovery, so its config lists no agent's target.
  // targetPrefix is the proxy's scrape address as Prometheus reaches it on the compose network.
  service.discovery {
    enabled = true
    targetPrefix = "proxy:8080"
  }

  // Evict a silent agent after 30s instead of 60s, checking every 5s, so the dead-link act (`demo.sh cut`) fits a
  // demo. Agents heartbeat every 5s, so a healthy one, or one on a slow link, never gets near the limit.
  internal {
    maxAgentInactivitySecs = 30
    staleAgentCheckPauseSecs = 5

    // A span for each gRPC call from an agent, to the demo's Zipkin, under this proxy's name.
    zipkin {
      enabled = true
      hostname = "zipkin"
      serviceName = "proxy"
    }
  }
}
