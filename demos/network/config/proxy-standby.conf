// The standby proxy: proxy.conf, with service discovery advertising this proxy's own scrape address. Each agent lists
// its link to the standby second in agent.proxy.endpoints, so an agent connects here only when it can't connect
// through its link to the primary, and stays until that connection drops.

include "proxy.conf"

proxy {
  service.discovery {
    targetPrefix = "proxy-standby:8080"
  }

  internal.zipkin.serviceName = "proxy-standby"
}
