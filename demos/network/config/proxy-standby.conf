// The standby proxy: proxy.conf, with service discovery advertising this proxy's own scrape address. Each agent lists
// its link to the standby second in agent.proxy.endpoints, so an agent connects here only when it can't connect
// through its link to the primary, and stays until that connection drops.

include "proxy.conf"

proxy {
  service.discovery {
    targetPrefix = "proxy-standby:8080"
  }

  // The screens the standby's screens page, /screens, shows beside its own dashboard, each in a tab: the primary's
  // dashboard, each agent's, Prometheus on its alerts, Grafana's network dashboard in kiosk mode, and Zipkin. The page
  // is the standby's rather than the primary's, since part 4 of the tour stops the primary and no part stops the
  // standby, so the page stays up through the tour. Each url is the address a browser on this machine reaches the
  // screen by, then the one compose gives the standby (NETWORK_DEMO_*_URL), which follows a port moved with
  // NETWORK_DEMO_*_PORT.
  dashboard.screens = [
    { name = "primary", url = "http://localhost:8194/dashboard", url = ${?NETWORK_DEMO_PRIMARY_URL} }
    { name = "agent-hq", url = "http://localhost:8196/dashboard", url = ${?NETWORK_DEMO_HQ_URL} }
    { name = "agent-branch", url = "http://localhost:8197/dashboard", url = ${?NETWORK_DEMO_BRANCH_URL} }
    { name = "Prometheus", url = "http://localhost:9190", url = ${?NETWORK_DEMO_PROMETHEUS_URL}, start = "/alerts" }
    {
      name = "Grafana"
      url = "http://localhost:3100"
      url = ${?NETWORK_DEMO_GRAFANA_URL}
      start = "/d/prometheus-proxy-network-demo?kiosk"
    }
    { name = "Zipkin", url = "http://localhost:9511", url = ${?NETWORK_DEMO_ZIPKIN_URL}, start = "/zipkin/" }
  ]

  internal.zipkin.serviceName = "proxy-standby"
}
