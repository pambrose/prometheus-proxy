// agent-branch: the agent at a branch office, at the far end of the WAN. It scrapes a large inventory payload, a small
// shipping service, and its own metrics. The scenarios degrade its links unless they're given another agent.

agent {
  name = "agent-branch"
  // Its two links through the simulated WAN (the wan service, Toxiproxy): to the primary proxy, then to the standby.
  proxy.endpoints = ["branch-to-proxy:50053", "branch-to-standby:50054"]
  // The token in proxy.conf: a demo token in a public file, never to be reused.
  agentToken = "demo-network-token"

  // Below Prometheus's 4s scrape timeout, so a hung target shows as the agent's upstream_timed_out (408).
  scrapeTimeoutSecs = 3
  // Scrape targets in parallel; with the default of 1, one slow target would hold up every other path.
  http.maxConcurrentClients = 8

  metrics.enabled = true

  // The agent's own dashboard, at http://localhost:8197/dashboard: its connection to each proxy endpoint, each path's
  // registration and recent scrapes, and what has happened to them, as only the agent sees it. compose.yml publishes
  // the port; it differs from agent-hq's, so the two dashboards' session cookies stay apart.
  dashboard {
    enabled = true
    port = 8197
    // Push the values that drift (uptime, backlog, retry countdowns) every second rather than every two.
    refreshIntervalSecs = 1
  }

  // A span for each gRPC call to the proxy but heartbeats and the path notices stream, and for each scrape, to the
  // demo's Zipkin, under this agent's name.
  internal.zipkin {
    enabled = true
    hostname = "zipkin"
    serviceName = "agent-branch"
  }

  pathConfigs: [
    {
      name: "Agent metrics"
      path: agent_branch_metrics
      labels: """{"job": "agent-branch", "site": "branch"}"""
      url: "http://localhost:8083/metrics"
    }
    {
      // About 8,000 series and 496,000 characters: large enough that the agent sends it to the proxy in chunks, and
      // that a thin link (`demo.sh thin`) can't carry it within Prometheus's scrape timeout.
      name: "Inventory service"
      path: inventory_metrics
      labels: """{"job": "inventory", "site": "branch"}"""
      url: "http://network-app:8000/inventory/metrics"
    }
    {
      name: "Shipping service"
      path: shipping_metrics
      labels: """{"job": "shipping", "site": "branch"}"""
      url: "http://network-app:8000/shipping/metrics"
    }
  ]
}
