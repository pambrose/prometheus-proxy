// agent-branch with a metric filter, for `demo.sh filter`: agent-branch.conf, plus a filter that drops the
// inventory's per-item price family at the agent, before the payload is gzipped and sent across the WAN. No dashboard
// uses it, and it is most of the inventory's payload, so the payload shrinks by more than half.

include "agent-branch.conf"

agent {
  filters: [
    {
      path: inventory_metrics
      // Both lists are required; an empty allow list keeps every family the deny list doesn't drop.
      metricNameAllow: []
      metricNameDeny: ["inventory_item_price_dollars"]
    }
  ]
}
