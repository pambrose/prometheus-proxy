# The demo's Prometheus, as Grafana's default datasource. The dashboard picks the default datasource through its
# `datasource` variable, so it needs no uid of its own.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      # Prometheus scrapes every 5s; $__rate_interval works from this.
      timeInterval: 5s
