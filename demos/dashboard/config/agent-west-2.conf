// agent-west-2: one of the two agents in the "west" data center, a redundant pair. Both run consolidated, so they
// serve shipping_metrics together: the proxy scrapes both replicas and merges the results, and the path keeps working
// when either agent stops (`demo.sh agent-stop agent-west-1`).

agent {
  name = "agent-west-2"
  proxy.hostname = "proxy"
  consolidated = true

  scrapeTimeoutSecs = 3
  http.maxConcurrentClients = 8

  metrics.enabled = true

  pathConfigs: [
    {
      name: "Agent metrics"
      path: agent_west_2_metrics
      labels: """{"job": "agent-west-2"}"""
      url: "http://localhost:8083/metrics"
    }
    {
      // The same path on both west agents; each scrapes its own replica, whose series carry a replica label.
      name: "Shipping service"
      path: shipping_metrics
      labels: """{"job": "shipping", "team": "logistics"}"""
      url: "http://demo-app:8000/shipping/west-2/metrics"
    }
  ]
}
