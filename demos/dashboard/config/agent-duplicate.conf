// agent-east-copy: agent-east's config deployed a second time by mistake, for `demo.sh duplicate-agent`. It registers
// the same paths with the same identity and without consolidated mode, so the proxy gives each path to the newer
// registration: agent-east-copy serves them all, and agent-east stays connected without paths, rather than the two
// taking the paths from each other every few seconds. The proxy logs which agent took them, and that consolidated mode
// is how two agents share a path.

include "agent-east.conf"

agent {
  name = "agent-east-copy"
  // The discovery file is agent-east's volume, which this container doesn't mount.
  discovery.enabled = false
  internal.zipkin.serviceName = "agent-east-copy"
}
