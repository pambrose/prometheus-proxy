// agent-west-1: one of the two agents in the "west" data center, a redundant pair. Both run consolidated, so they
// serve shipping_metrics together: the proxy scrapes both replicas and merges the results, and the path keeps working
// when either agent stops (`demo.sh agent-stop agent-west-2`).

agent {
  name = "agent-west-1"
  // The primary proxy, then the standby an agent fails over to when the primary is gone (`demo.sh proxy-down`).
  proxy.endpoints = ["proxy:50051", "proxy-standby:50051"]
  // The west identity's token (proxy.auth in proxy.conf): a demo token in a public file, never to be reused.
  agentToken = "demo-west-token"
  consolidated = true

  scrapeTimeoutSecs = 3
  http.maxConcurrentClients = 8

  metrics.enabled = true

  pathConfigs: [
    {
      name: "Agent metrics"
      path: agent_west_1_metrics
      labels: """{"job": "agent-west-1"}"""
      url: "http://localhost:8083/metrics"
    }
    {
      // The same path on both west agents; each scrapes its own replica, whose series carry a replica label.
      name: "Shipping service"
      path: shipping_metrics
      labels: """{"job": "shipping", "team": "logistics"}"""
      url: "http://demo-app:8000/shipping/west-1/metrics"
    }
  ]
}
