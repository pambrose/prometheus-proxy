// The standby proxy, for the failover scenario (`demo.sh proxy-down`): proxy.conf, with service discovery advertising
// this proxy's own scrape address. Every agent lists it second in agent.proxy.endpoints, so an agent connects here only
// when the primary is gone or refuses it, and stays until that connection drops.

include "proxy.conf"

proxy {
  service.discovery {
    targetPrefix = "proxy-standby:8080"
  }

  internal.zipkin.serviceName = "proxy-standby"
}
