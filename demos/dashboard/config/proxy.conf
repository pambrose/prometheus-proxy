// Proxy config for the dashboard demo (demos/dashboard/compose.yml). Every key here is checked against
// config/config.conf by ConfigFileKeysTest.

proxy {
  // The proxy's own metrics, which agent-east scrapes and sends back through the proxy, so the proxy monitors itself.
  metrics.enabled = true
  admin.enabled = true

  dashboard {
    enabled = true
    // Push the values that drift (idle times, backlogs, the eviction countdown) every second rather than every two.
    refreshIntervalSecs = 1
  }

  // Prometheus finds every path an agent registers through /discovery, so its config never lists a target.
  // targetPrefix is the proxy's scrape address as Prometheus reaches it on the compose network.
  service.discovery {
    enabled = true
    targetPrefix = "proxy:8080"
  }

  // Evict a silent agent after 30s instead of 60s, checking every 5s, so the "frozen agent" scenario fits a demo.
  // Agents heartbeat every 5s, so a healthy one never gets near the limit.
  internal {
    maxAgentInactivitySecs = 30
    staleAgentCheckPauseSecs = 5
  }
}
