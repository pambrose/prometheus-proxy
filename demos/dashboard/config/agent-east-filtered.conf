// agent-east with a metric filter, for `demo.sh filter`: agent-east.conf, plus a filter that drops the catalog's
// per-item price family at the agent, before the payload is gzipped and sent to the proxy. No dashboard uses it, and
// it is most of the catalog's payload, so the payload shrinks by more than half.

include "agent-east.conf"

agent {
  filters: [
    {
      path: catalog_metrics
      // Both lists are required; an empty allow list keeps every family the deny list doesn't drop.
      metricNameAllow: []
      metricNameDeny: ["catalog_item_price_dollars"]
    }
  ]
}
