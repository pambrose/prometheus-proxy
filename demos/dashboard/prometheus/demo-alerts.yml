# Fast alerting rules for the dashboard demo, so a scenario's alert fires within seconds rather than the minutes the
# production rules in grafana/alerts.yml wait. `make check-rules` validates this file with promtool.

groups:
  - name: prometheus-proxy-demo
    rules:
      # Down only when no proxy reaches the job: during a failover each job is down through the proxy that went and up
      # through the standby, and that isn't an outage (see prometheus.yml).
      - alert: DemoTargetDown
        expr: max by (job) (up) == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is not answering through either proxy"
          description: "Prometheus could not scrape {{ $labels.job }} through any proxy for 15s."

      - alert: DemoAgentEvicted
        expr: increase(proxy_eviction_count_total[2m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "The proxy evicted a silent agent"
          description: "An agent stopped sending heartbeats and was evicted after the proxy's inactivity limit."
