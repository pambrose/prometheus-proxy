// Proxy config for the plain Kotlin demo (demos/plain-kotlin/docker/compose.yml). The token the ovens' agents present
// comes from the environment (AGENT_TOKEN). Every key here is checked against config/config.conf by ConfigFileKeysTest.

proxy {
  // The proxy's own metrics, which Prometheus scrapes on the compose network: how many agents are connected, and how
  // the scrapes through them go.
  metrics.enabled = true

  // The dashboard, on 127.0.0.1 only (compose.yml): it has no authentication.
  dashboard {
    enabled = true
    refreshIntervalSecs = 1
  }

  // Prometheus finds each oven's paths through /discovery, so its config never lists an oven, and an oven added or
  // stopped is a target added or gone within one refresh. targetPrefix is the proxy's scrape address as Prometheus
  // reaches it on the compose network.
  service.discovery {
    enabled = true
    targetPrefix = "proxy:8080"
  }
}
