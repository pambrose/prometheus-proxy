// Proxy config for the Ktor demo (demos/ktor/docker/compose.yml). Its TLS certificate and key, and the token
// the coffee shop's agent presents, come from the environment (CERT_CHAIN_PEM, PRIVATE_KEY_PEM, AGENT_TOKEN), which
// demo.sh writes to docker/.env, so this file holds no secret. Every key here is checked against config/config.conf by
// ConfigFileKeysTest.

proxy {
  // The proxy's own metrics, which Prometheus scrapes on the compose network: how many agents are connected, and how
  // the scrapes through them go.
  metrics.enabled = true

  // The dashboard, on 127.0.0.1 only (compose.yml): it has no authentication, so on a cloud host it stays off.
  dashboard {
    enabled = true
    refreshIntervalSecs = 1

    // The screens the proxy's screens page, /screens, shows beside this dashboard, each in a tab: the coffee shop's
    // status page, its agent's dashboard, 1.1's agent's (which runs only once part 6's deploy starts it, so its tab
    // shows it not answering until then), the agent's /debug page, Prometheus on its alerts, and Grafana's coffee
    // shop dashboard in kiosk mode. Each url is the address a browser on this machine reaches the screen by, then the
    // one compose gives the proxy (KTOR_DEMO_*_URL), which follows a port moved with KTOR_DEMO_*_PORT.
    screens = [
      { name = "coffee shop", url = "http://localhost:8390", url = ${?KTOR_DEMO_APP_URL} }
      { name = "agent", url = "http://localhost:8395/dashboard", url = ${?KTOR_DEMO_AGENT_URL} }
      { name = "agent 1.1", url = "http://localhost:8396/dashboard", url = ${?KTOR_DEMO_NEXT_AGENT_URL} }
      { name = "debug", url = "http://localhost:8393", url = ${?KTOR_DEMO_DEBUG_URL}, start = "/debug" }
      { name = "Prometheus", url = "http://localhost:9390", url = ${?KTOR_DEMO_PROMETHEUS_URL}, start = "/alerts" }
      {
        name = "Grafana"
        url = "http://localhost:3300"
        url = ${?KTOR_DEMO_GRAFANA_URL}
        start = "/d/coffee-shop?kiosk"
      }
    ]
  }
}
