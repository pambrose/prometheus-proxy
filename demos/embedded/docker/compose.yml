# The Prometheus Proxy embedded demo: a coffee shop, a Ktor app with the agent embedded in it, which connects to a
# proxy, with Prometheus and Grafana beside the proxy: the setup the website's Cloud Platforms page describes, on one
# machine. See ../README.md. From demos/embedded:
#
#   make up        # builds the coffee shop against the latest release, and starts everything
#   make up-local  # the same, with the library, proxy, and coffee shop built from this checkout
#   make down      # stops it and removes its containers and network
#
# Compose resolves every relative path here against this file's directory, demos/embedded/docker: the demo's configs
# are one level up, and the repository root three. It reads the secrets from .env beside this file, which demo.sh
# writes: the proxy's TLS certificate and key, the certificate the coffee shop's agent trusts (the repository's test
# certificates, testing/certs), and a token.
#
# Every published port binds to 127.0.0.1 only: the proxy's dashboard and the agents' have no authentication, Grafana
# lets anyone view it without signing in, and its admin password is the default, which suits a demo on a laptop and
# nothing else. The default ports are the basics demo's plus 300, so the demos can run at once. Set
# EMBEDDED_DEMO_APP_PORT, EMBEDDED_DEMO_DASHBOARD_PORT, EMBEDDED_DEMO_PROXY_PORT, EMBEDDED_DEMO_PROMETHEUS_PORT,
# EMBEDDED_DEMO_GRAFANA_PORT, EMBEDDED_DEMO_AGENT_ADMIN_PORT, EMBEDDED_DEMO_AGENT_DASHBOARD_PORT, or
# EMBEDDED_DEMO_NEXT_AGENT_DASHBOARD_PORT to move a host port that's already taken.

name: prometheus-proxy-embedded-demo

# The coffee shop's settings, which its agent's in-memory config is built from (app/.../PrometheusAgent.kt). The
# agent connects to the proxy's agent port on the compose network, over TLS, checking the proxy's certificate against
# the CA that signed it, under the name it was issued for, and presents the token.
x-coffee-shop-env: &coffee-shop-env
  PROMETHEUS_PROXY: proxy:50051
  PROMETHEUS_AGENT_TOKEN: ${AGENT_TOKEN:-}
  PROMETHEUS_PROXY_CERT: ${PROXY_CA_PEM:-}
  PROMETHEUS_PROXY_AUTHORITY: foo.test.google.fr
  # Read by the agent itself, not the app, and over anything the app's code sets: its admin endpoints, on 8093, with
  # /debug, and its dashboard, on the port each version's DASHBOARD_PORT gives. Its own metrics need nothing here: the
  # app's code serves them at the proxy's /coffee_shop_agent_metrics. Take ADMIN_ENABLED and DEBUG_ENABLED out once
  # the agent works: the admin port has no authentication, and /threaddump shows every thread in the app. The dashboard
  # has no login either, unless DASHBOARD_PASSWORD sets one, and listens on every interface in the container, which a
  # published port needs, so the agent warns of it at startup.
  ADMIN_ENABLED: "true"
  DEBUG_ENABLED: "true"
  DASHBOARD_ENABLED: "true"

# The coffee shop's health: its /healthz answers 200. The image has bash, and no curl or wget.
x-coffee-shop-healthcheck: &coffee-shop-healthcheck
  test:
    - CMD
    - bash
    - -c
    - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3
  interval: 2s
  timeout: 2s
  retries: 30

services:
  # The app. demo.sh builds its image (app/Dockerfile): against the latest release, from Maven Central (make up), or
  # from the build on the host against this checkout (make up-local).
  coffee-shop:
    image: prometheus-proxy-demo/embedded-app:local
    build:
      context: ../app
      additional_contexts:
        catalog: ../../../gradle
      args:
        APP_BUILD: ${EMBEDDED_DEMO_APP_BUILD:-compiled}
        PROXY_VERSION: ${EMBEDDED_DEMO_PROXY_VERSION:-}
    environment:
      <<: *coffee-shop-env
      APP_VERSION: "1.0"
      # Its agent's dashboard's port. Each version has its own, which names its session cookie, once a login is on:
      # a browser keeps cookies by host name, not by port, so two dashboards on one port would share one.
      DASHBOARD_PORT: "8395"
    # The shop's address is the load balancer below, as a platform's is. Its published ports are its agent's: the admin
    # port, which ADMIN_ENABLED turns on, so the tour can show /debug, and the dashboard, which DASHBOARD_ENABLED turns
    # on. On a platform, they would stay on the internal network. 1.1 publishes only its dashboard.
    ports:
      - "127.0.0.1:${EMBEDDED_DEMO_AGENT_ADMIN_PORT:-8393}:8093"      # The agent's admin endpoints, /debug among them
      - "127.0.0.1:${EMBEDDED_DEMO_AGENT_DASHBOARD_PORT:-8395}:8395"  # The agent's dashboard
    depends_on:
      proxy:
        condition: service_started
    healthcheck: *coffee-shop-healthcheck
    restart: on-failure

  # The next release of the app, which `demo.sh deploy` starts beside the running one, as a rolling deploy does.
  # The load balancer sends it the shop's requests once the deploy has stopped 1.0.
  coffee-shop-next:
    image: prometheus-proxy-demo/embedded-app:local
    profiles: [deploy]
    environment:
      <<: *coffee-shop-env
      APP_VERSION: "1.1"
      DASHBOARD_PORT: "8396"
    ports:
      - "127.0.0.1:${EMBEDDED_DEMO_NEXT_AGENT_DASHBOARD_PORT:-8396}:8396"  # 1.1's agent's dashboard
    depends_on:
      proxy:
        condition: service_started
    healthcheck: *coffee-shop-healthcheck
    restart: on-failure

  # The coffee shop's load balancer, its one address, as a platform's is (config/Caddyfile): it sends every request to
  # 1.0, or to 1.1 once a deploy has stopped 1.0, so the shop's status page, its order counter, and its knobs keep
  # answering at the same URL through a deploy.
  load-balancer:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    volumes:
      - ../config/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${EMBEDDED_DEMO_APP_PORT:-8390}:8080"  # The shop's status page and order counter, for curl
    depends_on:
      coffee-shop:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: on-failure

  # The stock proxy image: the latest release's, which demo.sh pulls and tags as this one (make up), or one built from
  # this checkout's proxy jar (make up-local). It takes its certificate and key from the environment, with no file
  # mounted. Its agent port isn't published: the coffee shop reaches it on the compose network.
  proxy:
    image: prometheus-proxy-demo/proxy:local
    build:
      context: ../../..
      dockerfile: etc/docker/proxy.Dockerfile
    hostname: proxy
    environment:
      PROXY_CONFIG: /app/proxy.conf
      AGENT_TOKEN: ${AGENT_TOKEN:-}
      CERT_CHAIN_PEM: ${CERT_CHAIN_PEM:-}
      PRIVATE_KEY_PEM: ${PRIVATE_KEY_PEM:-}
    volumes:
      - ../config/proxy.conf:/app/proxy.conf:ro
    ports:
      - "127.0.0.1:${EMBEDDED_DEMO_DASHBOARD_PORT:-8394}:8094"  # Dashboard
      - "127.0.0.1:${EMBEDDED_DEMO_PROXY_PORT:-8380}:8080"      # Scrape port: the coffee shop's paths, for curl
    restart: on-failure

  # The same image, digest included, as PROMETHEUS_IMAGE in the Makefile.
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/embedded-alerts.yml:/etc/prometheus/rules/embedded-alerts.yml:ro
      - ../../../grafana/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
    ports:
      - "127.0.0.1:${EMBEDDED_DEMO_PROMETHEUS_PORT:-9390}:9090"
    depends_on:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: on-failure

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      # Anyone who opens Grafana sees the dashboards without signing in, as a Viewer, the only role Grafana gives
      # anonymous users. To use Explore or change a dashboard, sign in as admin / admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/coffee-shop.json
      # Nothing phones home or downloads at startup, so the demo runs offline once the images are pulled.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards/coffee-shop.json:/etc/grafana/dashboards/coffee-shop.json:ro
      # The project's own dashboards, from the repo, so the demo always shows the current ones.
      - ../../../grafana/prometheus-proxy.json:/etc/grafana/dashboards/prometheus-proxy.json:ro
      - ../../../grafana/prometheus-agents.json:/etc/grafana/dashboards/prometheus-agents.json:ro
    ports:
      - "127.0.0.1:${EMBEDDED_DEMO_GRAFANA_PORT:-3300}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: on-failure
