# The Prometheus Proxy basics demo: a proxy with its dashboard on, three agents with theirs behind a simulated
# firewall, a set of simulated services, and Prometheus and Grafana in front. See ../README.md. From demos/basics:
#
#   make up        # starts everything, with the proxy and agent of the latest release, from Docker Hub
#   make up-local  # the same, with the proxy and agent built from this checkout
#   make down      # stops it and removes its containers, network, and volume
#
# Compose resolves every relative path here against this file's directory, demos/basics/docker: the demo's configs
# are one level up, and the repository root three.
#
# Every published port binds to 127.0.0.1 only: the proxy's dashboard has no login unless ./demo.sh login turns it on,
# the agents' dashboards have none, Grafana lets anyone view it without signing in, and its admin password is the
# default, which suits a demo on a laptop and nothing else. Set DEMO_DASHBOARD_PORT, DEMO_GRAFANA_PORT,
# DEMO_PROMETHEUS_PORT, or DEMO_PROXY_PORT, or for an agent's dashboard DEMO_AGENT_EAST_DASHBOARD_PORT,
# DEMO_AGENT_WEST_1_DASHBOARD_PORT, DEMO_AGENT_WEST_2_DASHBOARD_PORT, DEMO_AGENT_ROGUE_DASHBOARD_PORT, or
# DEMO_AGENT_EAST_COPY_DASHBOARD_PORT, to move a host port that's already taken.

name: prometheus-proxy-demo

# Every agent shares one image: the latest release's, which demo.sh pulls and tags as this one (make up), or one
# built from this checkout's agent jar (make up-local, which builds with --build).
#
# Each agent serves its own dashboard (agent.dashboard in its config), published on its service below rather than
# here: each listens on a port of its own, in its container as well as on the host, since a dashboard names its login's
# session cookie after the port it listens on, and a browser sends localhost's cookies to every port.
x-agent: &agent
  image: prometheus-proxy-demo/agent:local
  build:
    context: ../../..
    dockerfile: etc/docker/agent.Dockerfile
  environment:
    AGENT_CONFIG: /app/agent.conf
  depends_on:
    proxy:
      condition: service_started
    demo-app:
      condition: service_healthy
  restart: on-failure

services:
  # The latest release's, or built from this checkout's proxy jar, as the agents' image is.
  proxy:
    image: prometheus-proxy-demo/proxy:local
    build:
      context: ../../..
      dockerfile: etc/docker/proxy.Dockerfile
    hostname: proxy
    environment:
      PROXY_CONFIG: /app/proxy.conf
      # The dashboard's login, which ./demo.sh login turns on, from the environment rather than proxy.conf, so no
      # password sits in a file. Empty, as make up leaves it, turns it off.
      DASHBOARD_PASSWORD: ${DEMO_DASHBOARD_PASSWORD:-}
    volumes:
      - ../config/proxy.conf:/app/proxy.conf:ro
    ports:
      - "127.0.0.1:${DEMO_DASHBOARD_PORT:-8094}:8094"  # Dashboard
      - "127.0.0.1:${DEMO_PROXY_PORT:-8080}:8080"      # Scrape port: /discovery and each path, for curl
    restart: on-failure

  agent-east:
    <<: *agent
    hostname: east-dc-01
    volumes:
      - ../config/agent-east.conf:/app/agent.conf:ro
      - discovery:/discovery:ro
    ports:
      - "127.0.0.1:${DEMO_AGENT_EAST_DASHBOARD_PORT:-8095}:8095"  # agent-east's dashboard

  agent-west-1:
    <<: *agent
    hostname: west-dc-01
    volumes:
      - ../config/agent-west-1.conf:/app/agent.conf:ro
    ports:
      - "127.0.0.1:${DEMO_AGENT_WEST_1_DASHBOARD_PORT:-8096}:8096"  # agent-west-1's dashboard

  agent-west-2:
    <<: *agent
    hostname: west-dc-02
    volumes:
      - ../config/agent-west-2.conf:/app/agent.conf:ro
    ports:
      - "127.0.0.1:${DEMO_AGENT_WEST_2_DASHBOARD_PORT:-8097}:8097"  # agent-west-2's dashboard

  # A contractor's agent reaching for a path its identity may not register; started only by `demo.sh rogue-agent`.
  agent-rogue:
    <<: *agent
    hostname: contractor-01
    profiles: [rogue]
    volumes:
      - ../config/agent-rogue.conf:/app/agent.conf:ro
    ports:
      - "127.0.0.1:${DEMO_AGENT_ROGUE_DASHBOARD_PORT:-8098}:8098"  # agent-rogue's dashboard

  # agent-east's config deployed a second time by mistake; started only by `demo.sh duplicate-agent`.
  agent-east-copy:
    <<: *agent
    hostname: east-dc-02
    profiles: [duplicate]
    volumes:
      - ../config/agent-east.conf:/app/agent-east.conf:ro
      - ../config/agent-duplicate.conf:/app/agent.conf:ro
    ports:
      - "127.0.0.1:${DEMO_AGENT_EAST_COPY_DASHBOARD_PORT:-8099}:8099"  # agent-east-copy's dashboard

  # The applications behind the firewall, simulated; it also writes agent-east's discovery file (app/demo_app.py).
  demo-app:
    image: python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd
    command: ["python", "-u", "/app/demo_app.py"]
    volumes:
      - ../app:/app:ro
      - discovery:/discovery
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: on-failure

  # The same image, digest included, as PROMETHEUS_IMAGE in the Makefile.
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/demo-alerts.yml:/etc/prometheus/rules/demo-alerts.yml:ro
      - ../../../grafana/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
    ports:
      - "127.0.0.1:${DEMO_PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    restart: on-failure

  grafana:
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      # Anyone who opens Grafana sees the dashboards without signing in, as a Viewer, the only role Grafana gives
      # anonymous users. To use Explore or change a dashboard, sign in as admin / admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/demo-overview.json
      # Nothing phones home or downloads at startup, so the demo runs offline once the images are pulled.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards/demo-overview.json:/etc/grafana/dashboards/demo-overview.json:ro
      # The project's own dashboards, from the repo, so the demo always shows the current ones.
      - ../../../grafana/prometheus-proxy.json:/etc/grafana/dashboards/prometheus-proxy.json:ro
      - ../../../grafana/prometheus-agents.json:/etc/grafana/dashboards/prometheus-agents.json:ro
    ports:
      - "127.0.0.1:${DEMO_GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 2s
      retries: 60
    restart: on-failure

volumes:
  # agent-east's discovery file, which demo-app writes and the agent reads.
  discovery:
