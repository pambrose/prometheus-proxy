// Proxy config for the basics demo (demos/basics/docker/compose.yml). Every key here is checked against
// config/config.conf by ConfigFileKeysTest.

proxy {
  // The proxy's own metrics, which agent-east scrapes and sends back through the proxy, so the proxy monitors itself.
  metrics.enabled = true
  admin.enabled = true

  dashboard {
    enabled = true
    // Push the values that drift (idle times, backlogs, the eviction countdown) every second rather than every two.
    refreshIntervalSecs = 1

    // No login here, as for most of the demo: ./demo.sh login, part 11 of the tour, turns it on with DASHBOARD_PASSWORD
    // in the proxy's environment, the way to set one, so no password sits in this file.

    // Links from each path in the Paths view to its job, the label the agents register each path with, in the demo's
    // Prometheus and Grafana, at the addresses a browser on this machine reaches them by. The Prometheus query is
    // up{job="{label.job}"}, percent-encoded but for the placeholder. A path whose agent has gone has no labels left,
    // so it gets no link. Moving Prometheus or Grafana with DEMO_PROMETHEUS_PORT or DEMO_GRAFANA_PORT leaves these at
    // the default ports. Each shows its tool's brand icon, with its name in the tooltip.
    links = [
      {
        name = "Prometheus"
        url = "http://localhost:9090/query?g0.expr=up%7Bjob%3D%22{label.job}%22%7D"
        icon = "prometheus"
      }
      {
        name = "Grafana"
        url = "http://localhost:3000/d/prometheus-proxy-demo?var-job={label.job}"
        icon = "grafana"
      }
    ]

    // The screens the proxy's screens page, /screens, shows beside this dashboard, each in a tab: every agent's
    // dashboard, Prometheus on its alerts, and Grafana's demo dashboard in kiosk mode. Each url is the address a
    // browser on this machine reaches the screen by, then the one compose gives the proxy (DEMO_*_URL), which follows
    // a port moved with DEMO_*_PORT. agent-rogue and agent-east-copy run only in the parts of the tour that start
    // them, so their tabs show them not answering until then.
    screens = [
      { name = "agent-east", url = "http://localhost:8095/dashboard", url = ${?DEMO_AGENT_EAST_URL} }
      { name = "agent-west-1", url = "http://localhost:8096/dashboard", url = ${?DEMO_AGENT_WEST_1_URL} }
      { name = "agent-west-2", url = "http://localhost:8097/dashboard", url = ${?DEMO_AGENT_WEST_2_URL} }
      { name = "agent-rogue", url = "http://localhost:8098/dashboard", url = ${?DEMO_AGENT_ROGUE_URL} }
      { name = "agent-east-copy", url = "http://localhost:8099/dashboard", url = ${?DEMO_AGENT_EAST_COPY_URL} }
      { name = "Prometheus", url = "http://localhost:9090", url = ${?DEMO_PROMETHEUS_URL}, start = "/alerts" }
      {
        name = "Grafana"
        url = "http://localhost:3000"
        url = ${?DEMO_GRAFANA_URL}
        start = "/d/prometheus-proxy-demo?kiosk"
      }
    ]
  }

  // Per-agent identities: each data center's agents connect with their own token, and an identity may register only
  // the paths its globs allow. The contractor identity is agent-rogue's, for `demo.sh rogue-agent`. These are demo
  // tokens in a public file: never reuse them.
  auth: [
    // The platform team's agent, which also carries the proxy's own metrics: it may register any path.
    {name: "east", token: "demo-east-token", paths: []}
    {name: "west", token: "demo-west-token", paths: ["shipping_metrics", "agent_west_*"]}
    {name: "contractor", token: "demo-contractor-token", paths: ["contractor_*"]}
  ]

  // Prometheus finds every path an agent registers through /discovery, so its config never lists a target.
  // targetPrefix is the proxy's scrape address as Prometheus reaches it on the compose network.
  service.discovery {
    enabled = true
    targetPrefix = "proxy:8080"
  }

  // Evict a silent agent after 30s instead of 60s, checking every 5s, so the "frozen agent" scenario fits a demo.
  // Agents heartbeat every 5s, so a healthy one never gets near the limit.
  internal {
    maxAgentInactivitySecs = 30
    staleAgentCheckPauseSecs = 5
  }
}
