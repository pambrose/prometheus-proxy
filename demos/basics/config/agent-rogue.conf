// agent-rogue: a contractor's agent, for `demo.sh rogue-agent`. It connects with the contractor identity's token, which
// proxy.conf allows only contractor_* paths. It registers its own contractor_metrics, which the proxy accepts, and
// payments_metrics, which agent-east serves and the contractor identity may not register: the proxy refuses it, and
// payments keeps coming from agent-east.

agent {
  name = "agent-rogue"
  proxy.endpoints = ["proxy:50051"]
  // The contractor identity's token (proxy.auth in proxy.conf): a demo token in a public file, never to be reused.
  agentToken = "demo-contractor-token"

  metrics.enabled = true

  // The agent's own dashboard (part 9 of the tour): its paths, where each stands with the proxy and why, its
  // connection, and what has happened to it. On a port of its own, which docker/compose.yml publishes on 127.0.0.1. It
  // has no login, so the agent logs a warning that it listens on every interface without one.
  dashboard {
    enabled = true
    port = 8098
    // Push what drifts, such as a retry's countdown, every second rather than every two, as the proxy's does.
    refreshIntervalSecs = 1
  }

  pathConfigs: [
    {
      name: "Agent metrics"
      path: contractor_metrics
      labels: """{"job": "contractor"}"""
      url: "http://localhost:8083/metrics"
    }
    {
      name: "Payments service"
      path: payments_metrics
      labels: """{"job": "payments", "team": "payments"}"""
      url: "http://demo-app:8000/payments/metrics"
    }
  ]
}
