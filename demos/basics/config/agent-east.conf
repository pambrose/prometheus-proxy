// agent-east: the agent in the "east" data center, inside the firewall. It scrapes the proxy's own metrics, its own,
// four simulated services, and whatever the discovery file lists (`demo.sh discover`).
//
// Each path's labels carry a job, which Prometheus takes as the job label of everything scraped from that path,
// through the proxy's service discovery.

agent {
  name = "agent-east"
  proxy.endpoints = ["proxy:50051"]
  // The east identity's token (proxy.auth in proxy.conf): a demo token in a public file, never to be reused.
  agentToken = "demo-east-token"

  // Below Prometheus's 4s scrape timeout, so a hung target shows as the agent's upstream_timed_out (408).
  scrapeTimeoutSecs = 3
  // Scrape targets in parallel; with the default of 1, one hung target would hold up every other path.
  http.maxConcurrentClients = 8

  metrics.enabled = true

  // The agent's own dashboard (part 9 of the tour): its paths, where each stands with the proxy and why, its
  // connection, and what has happened to it. On a port of its own, which docker/compose.yml publishes on 127.0.0.1. It
  // has no login, so the agent logs a warning that it listens on every interface without one.
  dashboard {
    enabled = true
    port = 8095
    // Push what drifts, such as a retry's countdown, every second rather than every two, as the proxy's does.
    refreshIntervalSecs = 1
  }

  // demo-app rewrites this file when `demo.sh discover` or `undiscover` runs; the agent re-reads it every 5s.
  discovery {
    enabled = true
    file.path = "/discovery/targets.json"
    reconcileIntervalSecs = 5
  }

  pathConfigs: [
    {
      name: "Proxy metrics"
      path: proxy_metrics
      // The job grafana/alerts.yml's ProxyDown rule expects.
      labels: """{"job": "prometheus-proxy"}"""
      url: "http://proxy:8082/metrics"
    }
    {
      name: "Agent metrics"
      path: agent_east_metrics
      // grafana/prometheus-agents.json tells agents apart by job.
      labels: """{"job": "agent-east"}"""
      url: "http://localhost:8083/metrics"
    }
    {
      name: "Orders service"
      path: orders_metrics
      labels: """{"job": "orders", "team": "commerce"}"""
      url: "http://demo-app:8000/orders/metrics"
    }
    {
      name: "Payments service"
      path: payments_metrics
      labels: """{"job": "payments", "team": "payments"}"""
      url: "http://demo-app:8000/payments/metrics"
    }
    {
      name: "Inventory service"
      path: inventory_metrics
      labels: """{"job": "inventory", "team": "fulfillment"}"""
      url: "http://demo-app:8000/inventory/metrics"
    }
    {
      // About 8,000 series: large enough that the agent sends it to the proxy in chunks.
      name: "Catalog service"
      path: catalog_metrics
      labels: """{"job": "catalog", "team": "commerce"}"""
      url: "http://demo-app:8000/catalog/metrics"
    }
  ]
}
