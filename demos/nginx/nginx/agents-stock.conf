# The agents' entrance, with nginx's stream timeouts at their defaults: TLS on port 443, with the repository's test
# certificate, passed to the proxy's agent port as plaintext gRPC. nginx closes a stream that's quiet for 60 seconds:
# grpc_read_timeout covers the streams the proxy sends on, scrape requests and path notices, and client_body_timeout the
# streams the agent sends results on. The proxy and an agent of this release send a keepalive on each after 30 seconds
# of quiet; an agent from 4.6.0 or earlier sends none, and its stream for results sent in chunks is quiet whenever its
# results are small, so nginx closes its connection every minute, scraped or not. `demo.sh nginx-stock` puts this file
# in place.
server {
  listen 443 ssl;
  # gRPC needs HTTP/2.
  http2 on;
  ssl_certificate     /etc/nginx/certs/server1.pem;
  ssl_certificate_key /etc/nginx/certs/server1.key;
  # nginx counts all an agent sends on a stream as one request body, and an agent's streams of results stay open while
  # it's connected, so nginx's default limit, 1 MB, would end one with 413 once its results added up to a megabyte. An
  # entrance for agents needs this whatever its timeouts.
  client_max_body_size 0;

  location / {
    # The proxy's agent port, in plaintext: nginx ends the agents' TLS here.
    grpc_pass grpc://proxy:50051;
  }
}
