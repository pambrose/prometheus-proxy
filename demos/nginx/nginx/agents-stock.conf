# The agents' entrance, with nginx's stream timeouts at their defaults: TLS on port 443, with the repository's test
# certificate, passed to the proxy's agent port as plaintext gRPC. nginx closes a stream that's quiet for 60 seconds:
# grpc_read_timeout covers the stream the proxy sends scrape requests on, and client_body_timeout the streams the agent
# sends results on. The proxy and an agent of this release send a keepalive on each after 30 seconds of quiet; an agent
# from 4.6.0 or earlier sends none, and its stream for results sent in chunks is quiet whenever its results are small,
# so nginx closes its connection every minute, scraped or not. `demo.sh nginx-stock` puts this file in place.
server {
  listen 443 ssl;
  # gRPC needs HTTP/2.
  http2 on;
  ssl_certificate     /etc/nginx/certs/server1.pem;
  ssl_certificate_key /etc/nginx/certs/server1.key;

  location / {
    # The proxy's agent port, in plaintext: nginx ends the agents' TLS here.
    grpc_pass grpc://proxy:50051;
  }
}
