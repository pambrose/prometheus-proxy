# The proxy dashboard's entrance, passing the WebSocket handshake's Upgrade and Connection headers, over HTTP/1.1, so
# the handshake reaches the dashboard. The Host header is still the upstream's name (proxy:8094), so the browser's
# Origin, the address it typed, doesn't match it, and the dashboard refuses the WebSocket and every POST.
# `demo.sh dashboard-upgrade` puts this file in place.

# Connection: upgrade on a WebSocket handshake, and close on anything else, as nginx's WebSocket proxying guide has it.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8090;

  location / {
    proxy_pass http://proxy:8094;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
