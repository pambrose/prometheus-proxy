# How long an old worker may keep its connections after a reload, before it closes them. nginx's default is none: an
# old worker keeps its connections, under the config they opened with, until they end, and an agent's connection, whose
# streams the keepalives keep open, never ends. So a reload's changes never reach an agent that's connected, and every
# reload leaves workers behind. With this, an old worker closes its connections 10 seconds after a reload, and each
# agent reconnects at once, to a new worker, under the new config. A worker takes this from the config it started with,
# so it covers the reloads after it's in place: `demo.sh nginx-shutdown-timeout` restarts nginx to bring it in.
worker_shutdown_timeout 10s;
