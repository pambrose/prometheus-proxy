# The demo's main nginx config: the one the nginx image ships, with two workers rather than one per CPU, and the
# include of main.d, where `demo.sh nginx-shutdown-timeout` puts main-shutdown-timeout.conf. Everything else the demo
# changes is in conf.d, which holds agents.conf and dashboard.conf, each copied from a variant in this directory.

user  nginx;
# Two workers, rather than one per CPU, so `demo.sh nginx-workers` lists a few processes, not dozens.
worker_processes  2;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

# Settings for the whole server, which `demo.sh nginx-shutdown-timeout` adds.
include /etc/nginx/main.d/*.conf;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
