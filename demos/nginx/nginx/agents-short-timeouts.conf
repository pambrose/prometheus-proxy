# The agents' entrance with both stream timeouts cut to 20 seconds, under the 30 seconds after which the proxy and an
# agent of this release send a keepalive, as some load balancers' idle timeouts are. `demo.sh nginx-short-timeouts`
# puts this file in place. Otherwise it's agents-stock.conf.
server {
  listen 443 ssl;
  # gRPC needs HTTP/2.
  http2 on;
  ssl_certificate     /etc/nginx/certs/server1.pem;
  ssl_certificate_key /etc/nginx/certs/server1.key;
  # The streams the agent sends scrape results on.
  client_body_timeout 20s;

  location / {
    # The proxy's agent port, in plaintext: nginx ends the agents' TLS here.
    grpc_pass grpc://proxy:50051;
    # The stream the proxy sends scrape requests on.
    grpc_read_timeout 20s;
  }
}
