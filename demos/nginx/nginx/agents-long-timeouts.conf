# The agents' entrance with both stream timeouts raised to a day, well above any quiet spell on an agent's streams, as
# an agent or a proxy from 4.6.0 or earlier needs. `demo.sh nginx-long-timeouts` puts this file in place. Otherwise
# it's agents-stock.conf.
server {
  listen 443 ssl;
  # gRPC needs HTTP/2.
  http2 on;
  ssl_certificate     /etc/nginx/certs/server1.pem;
  ssl_certificate_key /etc/nginx/certs/server1.key;
  # The streams the agent sends scrape results on.
  client_body_timeout 1d;

  location / {
    # The proxy's agent port, in plaintext: nginx ends the agents' TLS here.
    grpc_pass grpc://proxy:50051;
    # The stream the proxy sends scrape requests on.
    grpc_read_timeout 1d;
  }
}
