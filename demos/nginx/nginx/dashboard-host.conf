# The proxy dashboard's entrance, working: the WebSocket handshake's headers, and the Host header the browser sent,
# port included ($http_host; $host drops the port), so the browser's Origin matches it. Listing the address in
# proxy.dashboard.allowedOrigins instead would work too. `demo.sh dashboard-host` puts this file in place.

# Connection: upgrade on a WebSocket handshake, and close on anything else, as nginx's WebSocket proxying guide has it.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 8090;

  location / {
    proxy_pass http://proxy:8094;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
  }
}
