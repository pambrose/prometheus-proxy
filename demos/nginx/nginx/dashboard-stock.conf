# The proxy dashboard's entrance, as a first try at it usually looks: a plain proxy_pass. Pages load, but nginx passes
# the request on as HTTP/1.0 with the Host header set to the upstream's name (proxy:8094) and drops the Upgrade and
# Connection headers, so the dashboard's WebSocket, which carries its live updates, never opens.
# `demo.sh dashboard-stock` puts this file in place.
server {
  listen 8090;

  location / {
    proxy_pass http://proxy:8094;
  }
}
