// Proxy config for the nginx demo (demos/nginx/docker/compose.yml). Every key here is checked against
// config/config.conf by ConfigFileKeysTest.
//
// The proxy serves its agent port, 50051, in plaintext, to nginx only: the agents reach it through nginx, which ends
// their TLS. The stream keepalive interval (proxy.internal.streamKeepAliveSecs) is set on the command line in
// compose.yml, so `demo.sh keepalive <secs>` can change it.

proxy {
  // nginx relays each agent's calls over connections of its own, so the proxy can't watch an agent's connection, as
  // the transport filter does. With it off, the proxy learns an agent has gone when the agent's request stream ends,
  // and ties each agent's calls to the identity its token names. Every agent must turn it off too.
  transportFilterDisabled = true

  // The proxy's own metrics, which Prometheus scrapes directly: proxy_agent_disconnects_total counts each time nginx
  // closed an agent's stream, under reason="stream_terminated".
  metrics.enabled = true
  admin.enabled = true

  dashboard {
    enabled = true
    // Push the values that drift (idle times, uptimes) every second rather than every two.
    refreshIntervalSecs = 1

    // Links from each path in the Paths view to its job in the demo's Prometheus, at the address a browser on this
    // machine reaches it by. Moving Prometheus with NGINX_DEMO_PROMETHEUS_PORT leaves this at the default port.
    links = [
      {
        name = "Prometheus"
        url = "http://localhost:9690/query?g0.expr=up%7Bjob%3D%22{label.job}%22%7D"
        icon = "prometheus"
      }
    ]
  }

  // An identity for each agent, each with its own token and paths. With the transport filter off, the proxy tells
  // agents apart by identity, so agents that shared one couldn't be told apart. Demo tokens in a public file: never
  // reuse them.
  auth = [
    { name = "storefront", token = "demo-nginx-current-token", paths = ["storefront_metrics"] }
    { name = "warehouse", token = "demo-nginx-legacy-token", paths = ["warehouse_metrics"] }
  ]

  // Prometheus finds every path an agent registers through /discovery, so its config lists no agent's target.
  // targetPrefix is the proxy's scrape address as Prometheus reaches it on the compose network.
  service.discovery {
    enabled = true
    targetPrefix = "proxy:8080"
  }
}
