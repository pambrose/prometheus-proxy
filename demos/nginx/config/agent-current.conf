// agent-current: the agent beside the web storefront, inside the firewall, of this release. It and the proxy keep each
// stream between them open with a keepalive after 30 seconds of quiet (proxy.internal.streamKeepAliveSecs, which the
// proxy gives the agent as it registers), so nginx's 60-second stream timeouts never fire on it. Every key here is
// checked against config/config.conf by ConfigFileKeysTest.

agent {
  name = "agent-current"
  // The proxy turns its transport filter off behind nginx (proxy.conf), and the agent must match it.
  transportFilterDisabled = true

  // nginx, not the proxy: its agents' entrance (nginx/agents-*.conf), on the TLS port. Its certificate, the
  // repository's test certificate, names *.test.google.fr, and this is the name compose.yml gives nginx on the demo's
  // network, so the agent checks the certificate against the name it dials.
  proxy {
    hostname = "nginx.test.google.fr"
    port = 443
  }
  // The certificate of the CA that signed nginx's. An agent uses TLS only when it's given what to trust (or a client
  // certificate), so this is needed even for a certificate a public CA signed: then point it at a CA bundle.
  tls.trustCertCollectionFilePath = "/certs/ca.pem"
  // This agent's own identity (proxy.conf): a demo token in a public file, never to be reused.
  agentToken = "demo-nginx-current-token"

  // The agent's own dashboard, at http://localhost:8595/dashboard: its connection, and in its Activity view, each time
  // it connected and why it disconnected. compose.yml publishes the port.
  dashboard {
    enabled = true
    port = 8595
    refreshIntervalSecs = 1
  }

  pathConfigs: [
    {
      name: "Storefront"
      path: storefront_metrics
      // The job Prometheus files everything scraped from this path under, through the proxy's service discovery.
      labels: """{"job": "storefront"}"""
      url: "http://nginx-app:8000/storefront/metrics"
    }
  ]
}
