// agent-legacy: the agent beside the warehouse, inside the firewall, of release 4.6.0 (compose.yml pins its image),
// which predates the stream keepalives. Its stream for results sent in chunks carries nothing while its results are
// small, scraped or not, and the proxy, seeing it doesn't take keepalives, sends it none on the stream of scrape
// requests either, so nginx's stream timeouts close its connection. 4.6.0 has no agent dashboard, so this config sets
// none. Every key here is checked against config/config.conf by ConfigFileKeysTest.

agent {
  name = "agent-legacy"
  // The proxy turns its transport filter off behind nginx (proxy.conf), and the agent must match it.
  transportFilterDisabled = true

  // nginx, on its TLS port, by the name its certificate covers, as agent-current.conf explains.
  proxy {
    hostname = "nginx.test.google.fr"
    port = 443
  }
  tls.trustCertCollectionFilePath = "/certs/ca.pem"
  // This agent's own identity (proxy.conf): a demo token in a public file, never to be reused.
  agentToken = "demo-nginx-legacy-token"

  pathConfigs: [
    {
      name: "Warehouse"
      path: warehouse_metrics
      labels: """{"job": "warehouse"}"""
      url: "http://nginx-app:8000/warehouse/metrics"
    }
  ]
}
