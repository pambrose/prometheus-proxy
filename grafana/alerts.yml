# Prometheus alerting rules for the proxy and agent. Load this file from Prometheus' rule_files and tune the
# thresholds to your environment. Each rule is built on a metric documented on the website's Monitoring page, except
# ProxyDown, which uses Prometheus' own up series;
# `promtool check rules grafana/alerts.yml` validates it, and CI runs that check.
groups:
  - name: prometheus-proxy
    rules:
      # The rules below need the proxy's metrics, so this one covers the proxy itself going away. The job name is the
      # one in the documented scrape config; change it if yours differs.
      - alert: ProxyDown
        expr: up{job="prometheus-proxy"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus cannot scrape the proxy at {{ $labels.instance }}"

      - alert: ProxyScrapeSuccessRateLow
        expr: |
          sum(rate(proxy_scrape_requests_total{type="success"}[5m]))
            / sum(rate(proxy_scrape_requests_total[5m])) < 0.99
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Proxy scrape success rate below 99%"

      - alert: ProxyScrapeLatencyHigh
        expr: |
          histogram_quantile(0.99,
            sum by (le) (rate(proxy_scrape_request_latency_seconds_bucket[5m]))) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Proxy P99 scrape latency above 2s"

      - alert: ProxyNoAgentsConnected
        expr: proxy_agent_map_size == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No agents connected to the proxy"

      - alert: ProxyBacklogGrowing
        expr: proxy_cumulative_agent_backlog_size > 100
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Proxy agent scrape backlog is large ({{ $value }} queued)"

      # Covers both size limits: content_too_large is the agent's maxContentLengthMBytes rejecting
      # the target response, or the target's own 413; payload_too_large is the proxy's unzipped-size guard.
      - alert: ProxyPayloadTooLarge
        expr: rate(proxy_scrape_requests_total{type=~"payload_too_large|content_too_large"}[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Scrapes are being rejected for exceeding the size limit ({{ $labels.type }})"

      - alert: ProxyFrequentEvictions
        expr: rate(proxy_eviction_count_total[5m]) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Proxy is evicting stale agents repeatedly"

      # An agent with a wrong or missing token reconnects every few seconds and never appears, so the refused calls are
      # the only sign of it.
      - alert: ProxyAgentAuthFailures
        expr: sum by (reason) (rate(proxy_agent_auth_failures_total[5m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Proxy is refusing agent calls for their token ({{ $labels.reason }})"

      # A path an agent keeps asking for and the proxy keeps refusing is a target Prometheus never scrapes.
      - alert: ProxyPathRejections
        expr: sum by (cause) (rate(proxy_path_rejections_total[5m])) > 0
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Proxy keeps refusing path registrations ({{ $labels.cause }})"

  - name: prometheus-agent
    rules:
      # For an agent Prometheus scrapes directly. Scraped through the proxy, an agent that can't connect can't be
      # scraped either, so this rule doesn't see its failures, and its job's up series goes to 0 instead.
      - alert: AgentConnectFailures
        expr: rate(agent_connect_count_total{type="failure"}[5m]) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Agent {{ $labels.job }} is failing to connect to the proxy"

      - alert: AgentBacklogGrowing
        expr: agent_scrape_backlog_size > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Agent {{ $labels.job }} scrape backlog is large"

      # For an agent Prometheus scrapes directly. Scraped through the proxy, a disconnected agent's metrics can't be
      # read at all, and its job's up series goes to 0 instead.
      - alert: AgentDisconnected
        expr: agent_connected == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Agent {{ $labels.job }} is not connected to a proxy"

      # Every reconcile failing, the agent keeping the paths it read last: a missing or malformed discovery file.
      - alert: AgentDiscoveryFailing
        expr: |
          sum by (job) (increase(agent_discovery_reconciles_total{outcome="failure"}[15m])) > 0
            and sum by (job) (increase(agent_discovery_reconciles_total{outcome="success"}[15m])) == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Agent {{ $labels.job }} can't read its path discovery file"

      # Connected through a backup endpoint: the primary proxy, or the agent's link to it, is down.
      - alert: AgentNotOnPrimary
        expr: agent_proxy_endpoint_index > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Agent {{ $labels.job }} has been on a backup proxy endpoint for 30 minutes"
