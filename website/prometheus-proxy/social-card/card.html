<!doctype html>
<!--
  The docs site's link preview (docs/images/social-card.png), which overrides/main.html names in each page's OpenGraph
  and Twitter tags: the logo, the name, what the project does, and how, in the operational dashboard's dark colors and
  monospace (docs/DESIGN.md). After changing it, render it again at 1200x630 from the repository's root, on macOS:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot="$PWD/website/prometheus-proxy/docs/images/social-card.png" \
      "file://$PWD/website/prometheus-proxy/social-card/card.html"
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prometheus Proxy</title>
  <style>
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0d1015;
    }

    body {
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      padding: 88px 96px 72px;
      color: #e7ebf1;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .brand img {
      width: 112px;
      height: 112px;
    }

    h1 {
      margin: 0;
      font-size: 72px;
      font-weight: 640;
      line-height: 1;
      letter-spacing: 0;
    }

    .tagline {
      margin: 48px 0 0;
      max-width: 920px;
      color: #e7ebf1;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 40px;
      line-height: 1.3;
    }

    .flow {
      margin: auto 0 0;
      color: #a4aebc;
      font-size: 26px;
      white-space: pre;
    }

    .flow .wall {
      color: #ff7043;
      font-weight: 700;
    }

    .site {
      margin: 22px 0 0;
      color: #858f9d;
      font-size: 22px;
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="../docs/images/logo.svg" alt="">
    <h1>Prometheus Proxy</h1>
  </div>
  <p class="tagline">Prometheus scrapes endpoints behind a firewall, still by pull, with no inbound firewall rule.</p>
  <p class="flow">Prometheus ──▶ proxy ◀── gRPC ──<span class="wall">┃</span>── agent ──▶ /metrics</p>
  <p class="site">prometheus-proxy.com</p>
</body>
</html>
