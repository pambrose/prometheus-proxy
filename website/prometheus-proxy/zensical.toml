# ============================================================================
# Prometheus Proxy Documentation - Zensical Configuration
# ============================================================================

[project]

site_name = "Prometheus Proxy"
site_description = "Enable Prometheus to scrape metrics endpoints behind firewalls"
site_author = "Paul Ambrose"
site_url = "https://prometheus-proxy.com/"

repo_url = "https://github.com/pambrose/prometheus-proxy"
repo_name = "pambrose/prometheus-proxy"
# Where each page's edit and view-source links find it: the pages live under website/prometheus-proxy/docs, not in the
# repository's top-level docs directory, where the default looks.
edit_uri = "edit/master/website/prometheus-proxy/docs/"

# The Mermaid diagrams' styles, for javascripts/diagrams.js, which overrides/main.html loads ahead of the theme's bundle,
# then the site's own look: the dashboard's burnt orange and monospace, and the reference tables' and callouts' sizing.
extra_css = ["stylesheets/diagrams.css", "stylesheets/extra.css"]

copyright = """
Copyright &copy; 2026 Paul Ambrose
"""

# The sections follow what a reader is doing: getting started, watching a demo run, configuring, deploying, and
# operating the proxy and its agents, then embedding the agent in an app, which fewer readers do, and looking something
# up. Each embedded demo sits beside the integration it shows. A section's index.md, as its first entry, is the
# section's own page (navigation.indexes): its label opens it, and shows the page's icon, so those pages have none, and
# every section's label reads alike. Given with no title of its own, a page takes its title from its heading, where a
# title like "Overview" named three pages.
nav = [
  { "Get Started" = [
    { "Home" = "index.md" },
    { "Quick Start" = "getting-started.md" },
    { "Architecture" = "architecture.md" },
  ]},
  { "Demos" = [
    "demos/index.md",
    { "Basics Demo" = "basics-demo.md" },
    { "Network Demo" = "network-demo.md" },
    { "nginx Demo" = "nginx-demo.md" },
    { "Kubernetes Demo" = "kubernetes-demo.md" },
  ]},
  { "Configure" = [
    "configuration/index.md",
    { "Agent" = "configuration/agent.md" },
    { "Proxy" = "configuration/proxy.md" },
    "security/index.md",
    { "TLS Setup" = "security/tls.md" },
    { "Service Discovery" = "service-discovery.md" },
    { "Example Configs" = "examples.md" },
  ]},
  { "Deploy" = [
    { "Docker" = "docker.md" },
    { "Kubernetes" = "kubernetes.md" },
    { "Cloud Platforms" = "cloud-platforms.md" },
    { "Running in Production" = "production.md" },
    { "Advanced Topics" = "advanced.md" },
  ]},
  { "Operate" = [
    { "Dashboard" = "web-dashboard.md" },
    { "Agent Dashboard" = "agent-dashboard.md" },
    { "Monitoring" = "monitoring.md" },
    { "Grafana & Alerting" = "grafana.md" },
    { "Troubleshooting" = "troubleshooting.md" },
  ]},
  { "Embed" = [
    { "Embedded Agent" = "embedded-agent.md" },
    { "Plain Kotlin Demo" = "plain-kotlin-demo.md" },
    { "Ktor Plugin" = "ktor-plugin.md" },
    { "Ktor Demo" = "ktor-demo.md" },
    { "Spring Boot Starter" = "spring-boot-starter.md" },
    { "Spring Boot Demo" = "spring-boot-demo.md" },
  ]},
  { "Reference" = [
    { "CLI Reference" = "cli-reference.md" },
    { "Glossary" = "glossary.md" },
    { "KDocs" = "api.md" },
  ]},
]

# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]

# Template overrides: overrides/main.html loads the site's scripts, and overrides/404.html is the missing page's.
custom_dir = "overrides"

language = "en"

# The header's logo, and the tab's icon, the logo's small-size cut, whose heavier strokes stay legible at 16px. The
# dashboards' tab icon and the mark in their bar (DashboardLogo.SMALL_LOGO_SVG) are the same cut, and LogoTest keeps the
# two the same.
logo = "images/logo.svg"
favicon = "images/favicon.svg"

# No web font: the text is the system's sans and the headings and code the dashboard's system monospace
# (stylesheets/extra.css), so no page asks Google Fonts for one, as the dashboards ask nothing of any CDN.
font = false

# The header's repository link shows GitHub's mark, not a generic one.
icon.repo = "fontawesome/brands/github"

features = [
    "content.action.edit",
    "content.action.view",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# The reader's system setting first, then light, then dark: the toggle steps through the three, each named for the one it
# switches to. Both schemes take the dashboard's burnt orange for links, the current page, and focus (primary and accent
# "custom", whose values are in stylesheets/extra.css), so its screenshots sit in a site of their own colors.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# ----------------------------------------------------------------------------
# Social links
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pambrose/prometheus-proxy"
name = "GitHub repository"

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------

# Clicking an image opens it full size in a lightbox, GLightbox, which the theme loads from unpkg on a page that has
# one; the screenshots are taken at three times the pixel density, so the lightbox shows the detail the page's column
# scales away, and javascripts/screenshots.js keeps it from drawing one larger than its pixels, which blurs its text.
# The extension wraps each image in its link, so the pages give theirs none. A page's dark and light screenshots
# are separate galleries, so the arrows step through the ones the reader's theme shows, and each image's alt text is its
# caption.
[project.plugins.glightbox]
auto_themed = true
auto_caption = true

# The old address of a renamed page goes on working: it leaves a page there that sends the reader to the new one.
[project.plugins.redirects.redirect_maps]
"demo.md" = "basics-demo.md"
"embedded-demo.md" = "ktor-demo.md"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------

# Listing any extension here replaces Zensical's whole default set, so the set is listed in full: without it, the pages
# lost their headings' permalinks (toc) and the production checklist rendered as literal "[ ]" (tasklist). Left out:
# pymdownx.arithmatex, since no page has math and the site loads no math renderer for it.

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]                # Callouts (!!!)
[project.markdown_extensions.attr_list]                 # HTML attributes on Markdown elements
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]                # Markdown inside HTML blocks, for the grid cards

# Each heading's permalink, for linking straight to a setting or a step
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]          # Collapsible callouts (???)

# Inline icons (:material-*:, :octicons-*:, :fontawesome-*:)
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

# Syntax highlighting. Pygments has no HOCON lexer, so the config blocks are read as Scala, which colors their
# comments, strings, numbers, booleans, and ${?VAR} substitutions and, unlike JavaScript or HCL, flags none of their
# syntax as an error.
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
extend_pygments_lang = [{ name = "hocon", lang = "scala" }]

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]

# Code from files outside the pages: the examples the tests compile and run, and the shipped configs
[project.markdown_extensions.pymdownx.snippets]
base_path = ["../../src/test/kotlin/website", "../../src/test/java/website", "../.."]
check_paths = true

# Fenced code, and the Mermaid diagrams (Mermaid is built in)
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# Content tabs
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

# Checklists render as checkboxes
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
