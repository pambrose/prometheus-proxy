# ----------------------------------------------------------------------------
# Theme configuration
# ----------------------------------------------------------------------------
[project.theme]

# Template overrides; overrides/main.html adds the Context7 chat widget to every page.
custom_dir = "overrides"

language = "en"

features = [
    "announce.dismiss",
    "content.action.edit",
    "content.action.view",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "header.autohide",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

# Dark mode first = default
[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# ----------------------------------------------------------------------------
# Social links
# ----------------------------------------------------------------------------
[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pambrose/prometheus-proxy"

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------

# Clicking an image opens it full size in a lightbox, GLightbox, which the theme loads from unpkg on a page that has
# one; the screenshots are taken at twice the pixel density, so the lightbox shows the detail the page's column scales
# away. The extension wraps each image in its link, so the pages give theirs none. A page's dark and light screenshots
# are separate galleries, so the arrows step through the ones the reader's theme shows, and each image's alt text is its
# caption.
[project.plugins.glightbox]
auto_themed = true
auto_caption = true

# The old address of a renamed page goes on working: it leaves a page there that sends the reader to the new one.
[project.plugins.redirects.redirect_maps]
"demo.md" = "basics-demo.md"

# ----------------------------------------------------------------------------
# Markdown extensions
# ----------------------------------------------------------------------------

# attr_list - add HTML attributes to Markdown elements
[project.markdown_extensions.attr_list]

# md_in_html - render Markdown inside HTML blocks (needed for grid cards)
[project.markdown_extensions.md_in_html]

# admonition - callout blocks (!!!)
[project.markdown_extensions.admonition]

# pymdownx.details - collapsible admonitions (???)
[project.markdown_extensions.pymdownx.details]

# pymdownx.emoji - inline icons (:material-*:, :octicons-*:, :fontawesome-*:)
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "material.extensions.emoji.twemoji"
emoji_generator = "material.extensions.emoji.to_svg"

# pymdownx.snippets - import code from external files
[project.markdown_extensions.pymdownx.snippets]
base_path = ["../../src/test/kotlin/website", "../../src/test/java/website", "../.."]
check_paths = true

# pymdownx.superfences - fenced code blocks with Mermaid support (Mermaid is built-in)
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# pymdownx.tabbed - content tabs
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

# pymdownx.highlight - syntax highlighting
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
