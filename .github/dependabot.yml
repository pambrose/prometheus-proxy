# Keeps the workflow actions and the Gradle version catalog current. Actions are pinned to commit SHAs with the
# version in a trailing comment; Dependabot updates the SHA and the comment together. Updates are grouped per
# ecosystem so a routine week produces one PR each rather than one per dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # grpc-java pins protobuf 3.x (grpc 1.84 depends on protobuf-java 3.25.9), and protobuf-generated code does not
      # carry across a protobuf major, so a protobuf major waits for a grpc release that supports it.
      - dependency-name: "com.google.protobuf:protobuf-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.protobuf:protoc"
        update-types: ["version-update:semver-major"]
      # The dashboard is built against the htmx 2 API and its matching WebSocket extension (htmx-ext-ws). An htmx
      # major changes that API and needs a planned upgrade, not a routine bump.
      - dependency-name: "org.webjars.npm:htmx*"
        update-types: ["version-update:semver-major"]
