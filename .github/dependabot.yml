# Keeps the workflow actions, the Gradle version catalog, the docs site's Python lock, and the nginx example image
# current. Actions are pinned to commit SHAs with the
# version in a trailing comment; Dependabot updates the SHA and the comment together. Updates are grouped per
# ecosystem so a routine week produces one PR each rather than one per dependency.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # grpc-java pins protobuf 3.x (grpc 1.84 depends on protobuf-java 3.25.9), and protobuf-generated code does not
      # carry across a protobuf major, so a protobuf major waits for a grpc release that supports it.
      - dependency-name: "com.google.protobuf:protobuf-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.protobuf:protoc"
        update-types: ["version-update:semver-major"]
      # The dashboard is built against the htmx 2 API and its matching WebSocket extension (htmx-ext-ws). An htmx
      # major changes that API and needs a planned upgrade, not a routine bump.
      - dependency-name: "org.webjars.npm:htmx*"
        update-types: ["version-update:semver-major"]
      # netty-tcnative follows grpc-java, not tcnative's own releases: it stays at the version grpc is built and tested
      # with, and is updated together with grpc.
      - dependency-name: "io.netty:netty-tcnative*"

  # The docs site's Python dependencies (website/pyproject.toml and uv.lock), including the mkdocs-material pin.
  - package-ecosystem: uv
    directory: /website
    schedule:
      interval: weekly
    groups:
      docs-site:
        patterns: ["*"]

  # The nginx reverse-proxy example. The proxy and agent images (etc/docker/*.df) aren't covered: Dependabot only
  # recognizes files named Dockerfile, *.Dockerfile, or Dockerfile.*, so their digest-pinned base is bumped by hand,
  # as the comment in each file describes.
  - package-ecosystem: docker
    directory: /nginx/docker
    schedule:
      interval: weekly
