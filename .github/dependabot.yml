# Keeps the workflow actions, the Gradle version catalog, the docs site's Python lock, and the Docker base images
# current. Actions are pinned to commit SHAs with the
# version in a trailing comment; Dependabot updates the SHA and the comment together. Updates are grouped per
# ecosystem so a routine week produces one PR each rather than one per dependency.
# Each update waits 7 days after its release (zizmor's dependabot-cooldown audit), so a compromised release is usually
# pulled before it reaches a PR; Dependabot security updates aren't held back.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      gradle-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # A protobuf major changes the runtime the code protoc generates needs, and grpc's own generated classes have to
      # run on it too, so it's a planned upgrade, not a routine bump. The project needn't wait for grpc-java to move: it
      # is on protobuf 4.x while grpc depends on 3.25.9 (see `protoc` in libs.versions.toml).
      - dependency-name: "com.google.protobuf:protobuf-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.protobuf:protoc"
        update-types: ["version-update:semver-major"]
      # The dashboard is built against the htmx 4 API, whose WebSocket extension ships in htmx.org. An htmx major
      # changes that API and needs a planned upgrade, not a routine bump.
      - dependency-name: "org.webjars.npm:htmx*"
        update-types: ["version-update:semver-major"]
      # netty-tcnative is updated by hand, not on tcnative's own releases. libs.versions.toml pins it, currently ahead of
      # the version grpc-java is built and tested with for BoringSSL fixes, and says when to return to grpc's version.
      - dependency-name: "io.netty:netty-tcnative*"

  # The docs site's Python dependencies (website/pyproject.toml and uv.lock), including the mkdocs-material pin.
  - package-ecosystem: uv
    directory: /website
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs-site:
        patterns: ["*"]

  # The proxy and agent images' digest-pinned bases: distroless, the OS the images run on, which has only a latest
  # tag, so Dependabot bumps its digest, and eclipse-temurin, which supplies the JRE, whose digest and tag (within the
  # Java 25 line) it bumps. Either way, OS and Java security patches arrive as a PR.
  - package-ecosystem: docker
    directory: /etc/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The images ship Java 25, the LTS the tests run on; moving to another Java line is a deliberate change.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # The nginx reverse-proxy example.
  - package-ecosystem: docker
    directory: /nginx/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The basics demo's third-party images (demos/basics/docker/compose.yml): Grafana and the Python image its
  # simulated services run on, each pinned by tag and digest. The proxy and agent images it builds from this checkout
  # aren't pulled, so there's nothing to update for them.
  - package-ecosystem: docker-compose
    directory: /demos/basics/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      dashboard-demo:
        patterns: ["*"]
    ignore:
      # The demo runs the Prometheus the Makefile's PROMETHEUS_IMAGE pins, which check-rules validates its config with
      # and CiHygieneTest holds it to; it moves with that pin, by hand, not on its own.
      - dependency-name: "prom/prometheus"

  # The network demo's third-party images (demos/network/docker/compose.yml): Toxiproxy, Grafana, Zipkin, and the
  # Python image its simulated services run on, each pinned by tag and digest. Like the basics demo, it builds its
  # proxy and agent images from this checkout.
  - package-ecosystem: docker-compose
    directory: /demos/network/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      network-demo:
        patterns: ["*"]
    ignore:
      # As in the basics demo, Prometheus moves with the Makefile's PROMETHEUS_IMAGE, by hand.
      - dependency-name: "prom/prometheus"

  # The embedded demo's third-party images (demos/embedded/docker/compose.yml): Grafana and Caddy, the coffee shop's
  # load balancer, each pinned by tag and digest. Its proxy image is the latest release's or one built from this
  # checkout, and its coffee shop is built, so there's nothing to update for them here.
  - package-ecosystem: docker-compose
    directory: /demos/embedded/docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      embedded-demo:
        patterns: ["*"]
    ignore:
      # As in the other demos, Prometheus moves with the Makefile's PROMETHEUS_IMAGE, by hand.
      - dependency-name: "prom/prometheus"

  # The images the embedded demo's coffee shop is built and runs on (demos/embedded/app/Dockerfile): Gradle, on the
  # JDK the runtime ships, and eclipse-temurin's JRE, both pinned by tag and digest. Its Kotlin, Ktor, and Micrometer
  # come from the repository's version catalog, which the gradle entry above keeps up to date.
  - package-ecosystem: docker
    directory: /demos/embedded/app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      embedded-demo-app:
        patterns: ["*"]
    ignore:
      # Java 25, the LTS the proxy and agent images ship, as in /etc/docker; moving to another line is a deliberate
      # change, and the Gradle image's JDK goes with it.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  # The Kubernetes demo's third-party images in its manifests (demos/kubernetes/k8s), which the docker ecosystem reads:
  # the Python image its simulated services and targets-sync run on, pinned by tag and digest. Its kind node image
  # (demos/kubernetes/kind) isn't here: it moves with the kind release it was built for, by hand. Like the other demos,
  # it builds its proxy and agent images from this checkout.
  - package-ecosystem: docker
    directory: /demos/kubernetes/k8s
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      kubernetes-demo:
        patterns: ["*"]
    ignore:
      # As in the other demos, Prometheus moves with the Makefile's PROMETHEUS_IMAGE, by hand.
      - dependency-name: "prom/prometheus"
