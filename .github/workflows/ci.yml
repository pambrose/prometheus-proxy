name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes a run still in progress. Runs on master are never cancelled, so
# every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Set HARNESS_CONFIG at the job level so every Gradle invocation observes the same value.
    # The build script propagates this into the `test` task's environment, making it part of
    # the task inputs; if it varied between steps Gradle would consider `:test` out-of-date and
    # re-run the suite under the default (MEDIUM) config when koverXmlReport executes.
    env:
      HARNESS_CONFIG: MINI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and the tests, matching the Docker runtime; JDK 17 is the
          # toolchain the main code compiles with.
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # build runs check without the tests, and check already includes lintKotlin and detekt.
      - name: Compile, lint, and detekt (no tests)
        run: ./gradlew clean build -x test

      # --continue lets the kover report tasks run even if some tests fail, preserving the
      # prior behavior where coverage was still uploaded on test failure.
      - name: Run tests and generate coverage report
        run: ./gradlew --continue test koverVerify koverXmlReport koverLog

      # A separate Gradle invocation on purpose: Kover 0.9.9 applies one report variant's filters to every report built
      # in the same run, which would corrupt the total report above (see configureCoverage() in build.gradle.kts).
      - name: Verify per-class coverage
        run: ./gradlew koverVerifyPerClass

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: unittests
          name: prometheus-proxy
          fail_ci_if_error: false

  # Model-checks the TLA+ specs in specs/tla (ProxyRegistry and AgentFailover) with their quick configs, alongside the
  # build. The specs model the design rather than test the code, so this catches a spec edit that breaks one of their
  # properties; keeping each spec in step with the classes it models is up to the change that touches them (see
  # specs/tla/README.md). make downloads the pinned TLA+ tools and checks their SHA-256 before running them.
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - name: Model-check the TLA+ specs
        run: make tla-checks
