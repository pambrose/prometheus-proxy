name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes a run still in progress. Runs on master are never cancelled, so
# every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `make ci` runs these jobs locally (CI_JOBS and the ci-build target in the Makefile); keep it in step with them.
jobs:
  build:
    runs-on: ubuntu-latest
    # About 5 minutes; without a limit, a hung harness test would hold this required check for GitHub's 6-hour default.
    timeout-minutes: 30
    # MINI is also the default, but the job names the profile it runs, which the build script passes to the tests.
    env:
      HARNESS_CONFIG: MINI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and the tests, matching the Docker runtime; JDK 17 is the
          # toolchain the main code compiles with.
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # One Gradle invocation, so the code compiles once, and lint and detekt run alongside the compile; check is
      # lintKotlin, detekt, and the tests. Not build, whose fat JARs only took CPU from the compile here: container-tests,
      # helm-smoke, and image-scan build and test them. --continue runs every task it can past a failure: a lint failure
      # still runs the tests, and a coverage floor's failure still writes the coverage report. A test failure doesn't:
      # the kover tasks depend on the test task, so Gradle skips them and the Codecov upload finds no report.
      - name: Compile, lint, detekt, run the tests, verify coverage, and generate the coverage report
        run: ./gradlew --continue clean check koverVerify koverVerifyPerClass koverXmlReport koverLog

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            spring-boot-starter/build/reports/tests/
            spring-boot-starter/build/test-results/
            ktor-plugin/build/reports/tests/
            ktor-plugin/build/test-results/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: unittests
          name: prometheus-proxy
          fail_ci_if_error: false

  # Model-checks the TLA+ specs in specs/tla (ProxyRegistry and AgentFailover) alongside the build. The specs model the
  # design rather than test the code, so this catches a spec edit that breaks one of their properties; keeping each
  # spec in step with the classes it models is up to the change that touches them (see specs/tla/README.md). make
  # downloads the pinned TLA+ tools and checks their SHA-256 before running them. It runs the quick configs, and the
  # full set, with the slower reconnect config, only when what TLC reads changes: a file under specs/tla, or the pinned
  # tools (TLA_VERSION or TLA_SHA256 in the Makefile). TLC reads nothing else, so any other change gets the same result.
  # The checkout is the pull request's merge commit, or a squash-merged commit on master, so its first parent is the
  # base; a manual run, or one whose base can't be read, checks the full set.
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - name: Choose the quick or the full TLA+ checks
        id: choose
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] \
            || ! git diff --quiet HEAD^1 HEAD -- specs/tla \
            || git diff HEAD^1 HEAD -- Makefile | grep -qE '^[-+]TLA_(VERSION|SHA256) '; then
            echo "target=tla-checks-full" >> "$GITHUB_OUTPUT"
          else
            echo "target=tla-checks" >> "$GITHUB_OUTPUT"
          fi
      - name: Model-check the TLA+ specs
        env:
          TARGET: ${{ steps.choose.outputs.target }}
        run: make "$TARGET"

  # Validates the alerting rules users load into Prometheus (grafana/alerts.yml) and runs their unit tests
  # (etc/promtool), and validates each demo's Prometheus config and rules, with promtool, from the Prometheus image the
  # container suite runs. DashboardMetricNamesTest separately checks that every series the rules query is one the proxy
  # or agent exposes.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the alerting rules
        run: make check-rules

  # Lints the Helm charts in charts/ with each of their ci/ values files and validates the rendered manifests against
  # the Kubernetes schemas. container-tests.yml installs them into a kind cluster.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the charts and validate their manifests
        run: make helm-lint

  # Builds the docs site (website/prometheus-proxy) from website/uv.lock, as docs.yml does before it adds the KDocs and
  # deploys, so a change that breaks the build fails its pull request instead of master's deploy: a moved snippet
  # source (zensical.toml checks snippet paths), or a Zensical update in Dependabot's weekly docs-site group. Named
  # docs-site, not build, since the branch protection requires a check named build, which this must not be taken for.
  docs-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv reads website/.python-version and installs that Python itself.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          # Without a version, setup-uv installs the newest uv, so the build could change with no diff here. The same
          # uv as docs.yml's (CiHygieneTest checks); update both with the uv website/uv.lock is locked with.
          version: "0.13.7"
      - name: Build the docs site
        run: make build-site

  # Builds etc/consumer-check, a Maven project that depends only on the artifact this commit would publish, as an
  # application that embeds the agent does (`make consumer-check`). The other jobs compile and test against Gradle's
  # resolution, so only this one sees what a Maven embedder gets: it fails unless the docs site's embedded-agent
  # examples compile; Jackson, netty-tcnative, Netty, protobuf, and every Prometheus Java client module resolve at the
  # catalog's versions; no jar on the classpath carries a logback.xml, and the library jar carries its reference.conf;
  # and, for a Ktor app that adds the Ktor plugin, every Ktor module resolves at the catalog's version and the docs
  # site's Ktor plugin examples compile (etc/consumer-check/check.sh). make spring-boot-demo-check then builds the
  # Spring Boot demo's roastery (demos/spring-boot/app) against the same artifact, at the versions Spring Boot's
  # dependency management sets, and runs its RoasteryAgentTest, which starts the agent against a proxy. make
  # ktor-demo-check builds the Ktor demo's coffee shop (demos/ktor/app), a Gradle project of its own that
  # embeds the agent through the Ktor plugin, against this checkout, so a change to the plugin or to
  # EmbeddedAgentConfig that breaks the demo fails here, and make plain-kotlin-demo-check builds the plain Kotlin demo's
  # oven (demos/plain-kotlin/app), which embeds the agent in a plain Kotlin program, the same way. make -k runs every
  # check even when one fails, so each reports. The runner's Maven builds the Maven projects; setup-java caches what
  # they download, keyed on their poms and the version catalog.
  consumer-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and Maven; JDK 17 is the toolchain the main code compiles with.
          java-version: |
            17
            25
          cache: maven
          cache-dependency-path: |
            etc/consumer-check/pom.xml
            demos/spring-boot/app/pom.xml
            gradle/libs.versions.toml
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the projects that embed the agent, the Spring Boot, Ktor, and plain Kotlin demos' among them
        run: make -k consumer-check spring-boot-demo-check ktor-demo-check plain-kotlin-demo-check
