name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request supersedes a run still in progress. Runs on master are never cancelled, so
# every merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `make ci` runs these jobs locally (CI_JOBS and the ci-build target in the Makefile); keep it in step with them.
jobs:
  build:
    runs-on: ubuntu-latest
    # About 5 minutes; without a limit, a hung harness test would hold this required check for GitHub's 6-hour default.
    timeout-minutes: 30
    # Set HARNESS_CONFIG at the job level so every Gradle invocation observes the same value.
    # The build script propagates this into the `test` task's environment, making it part of
    # the task inputs; if it varied between steps Gradle would consider `:test` out-of-date and
    # re-run the suite under the default (MEDIUM) config when koverXmlReport executes.
    env:
      HARNESS_CONFIG: MINI
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and the tests, matching the Docker runtime; JDK 17 is the
          # toolchain the main code compiles with.
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # build runs check without the tests, and check already includes lintKotlin and detekt.
      - name: Compile, lint, and detekt (no tests)
        run: ./gradlew clean build -x test

      # --continue still writes the coverage report when a coverage floor fails. It doesn't when a test fails: the
      # kover tasks depend on the test task, so Gradle skips them and the Codecov upload finds no report.
      - name: Run tests, verify coverage, and generate the coverage report
        run: ./gradlew --continue test koverVerify koverVerifyPerClass koverXmlReport koverLog

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          flags: unittests
          name: prometheus-proxy
          fail_ci_if_error: false

  # Model-checks the TLA+ specs in specs/tla (ProxyRegistry and AgentFailover) with their quick configs, alongside the
  # build. The specs model the design rather than test the code, so this catches a spec edit that breaks one of their
  # properties; keeping each spec in step with the classes it models is up to the change that touches them (see
  # specs/tla/README.md). make downloads the pinned TLA+ tools and checks their SHA-256 before running them.
  tla:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - name: Model-check the TLA+ specs
        run: make tla-checks

  # Validates the alerting rules users load into Prometheus (grafana/alerts.yml) with promtool, from the Prometheus
  # image the container suite runs. DashboardMetricNamesTest separately checks that every series the rules query is
  # one the proxy or agent exposes.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the alerting rules
        run: make check-rules

  # Lints the Helm charts in charts/ with each of their ci/ values files and validates the rendered manifests against
  # the Kubernetes schemas. container-tests.yml installs them into a kind cluster.
  helm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the charts and validate their manifests
        run: make helm-lint

  # Builds the docs site (website/prometheus-proxy) from website/uv.lock, as docs.yml does before it adds the KDocs and
  # deploys, so a change that breaks the build fails its pull request instead of master's deploy: a moved snippet
  # source (zensical.toml checks snippet paths), or a Zensical update in Dependabot's weekly docs-site group. Named
  # docs-site, not build, since the branch protection requires a check named build, which this must not be taken for.
  docs-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv reads website/.python-version and installs that Python itself.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build the docs site
        run: make build-site
