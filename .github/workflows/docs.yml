name: Documentation
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the docs site + KDocs and upload the Pages artifact. Kept separate from
  # the deploy job so that recovering a failed deploy means re-running only the
  # deploy job (via "Re-run failed jobs"), which does NOT re-upload the artifact.
  # actions/deploy-pages hard-fails when a run contains more than one artifact
  # named "github-pages", which is what re-running a combined build+deploy job did.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.published.outputs.deploy }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The site gives, as its Docker image tag and Maven coordinate, the version that step 2 of docs/RELEASE.md bumps
      # (`make site-version` prints it), and a bumped version doesn't exist until `make release` publishes it. So a
      # push deploys only once the version's POM is on Maven Central and both its images are on Docker Hub; until then
      # the site stays at the previous release. Between releases the site still gives the last one, which is
      # published, so docs changes deploy as they merge, whatever gradle.properties holds: a -SNAPSHOT there had kept
      # every docs change from deploying until the next release. A workflow_dispatch always deploys: `make release`
      # starts one (`make gh-docs`) once it has verified the images. The site is built either way, so a push that
      # doesn't deploy still checks the build. If make can't name one version, the job fails.
      - name: Check that the version the site gives is published
        id: published
        run: |
          deploy=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version=$(make -s --no-print-directory site-version)
            for url in \
              "https://repo1.maven.org/maven2/com/pambrose/prometheus-proxy/$version/prometheus-proxy-$version.pom" \
              "https://hub.docker.com/v2/namespaces/pambrose/repositories/prometheus-proxy/tags/$version" \
              "https://hub.docker.com/v2/namespaces/pambrose/repositories/prometheus-agent/tags/$version"; do
              code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 30 "$url" || true)
              case "$code" in
                200) ;;
                404)
                  deploy=false
                  echo "::notice::Not deploying: $version isn't published yet ($url); make release deploys the site once it is" ;;
                *)
                  deploy=false
                  echo "::warning::Not deploying: could not tell whether $version is published ($url answered $code); make gh-docs deploys the site" ;;
              esac
            done
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

      # Build the Zensical documentation site from website/uv.lock with `make build-site`, which CI's docs-site job
      # also runs on every pull request. uv reads website/.python-version and installs that Python itself.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Without a version, setup-uv installs the newest uv, so the deploy could change with no diff here. The same
          # uv as ci.yml's docs-site job (CiHygieneTest checks); update both with the uv website/uv.lock is locked with.
          version: "0.13.7"
      # mkdocs-material, which the emoji extension needs, is pinned in website/pyproject.toml and so in uv.lock.
      - run: make build-site

      # Build KDoc API documentation
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and the tests, matching the Docker runtime; JDK 17 is the
          # toolchain the main code compiles with.
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew dokkaGeneratePublicationHtml

      # Copy KDocs into the Zensical site output
      - run: cp -r build/dokka/html website/prometheus-proxy/site/kdocs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/prometheus-proxy/site

  # Deploy the artifact produced by the build job. Deliberately minimal (no
  # checkout or build) so re-running just this job re-deploys the existing
  # artifact without rebuilding or re-uploading it. It is skipped on a push whose
  # version isn't published yet (the build job's check).
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
