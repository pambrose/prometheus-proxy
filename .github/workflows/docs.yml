name: Documentation
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build the docs site + KDocs and upload the Pages artifact. Kept separate from
  # the deploy job so that recovering a failed deploy means re-running only the
  # deploy job (via "Re-run failed jobs"), which does NOT re-upload the artifact.
  # actions/deploy-pages hard-fails when a run contains more than one artifact
  # named "github-pages", which is what re-running a combined build+deploy job did.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build the Zensical documentation site from website/uv.lock, the same resolution `make site`
      # uses locally. uv reads website/.python-version and installs that Python itself.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # mkdocs-material, which the emoji extension needs, is pinned in website/pyproject.toml and so in uv.lock.
      - run: uv run --locked zensical build --clean
        working-directory: website/prometheus-proxy

      # Build KDoc API documentation
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and the tests, matching the Docker runtime; JDK 17 is the
          # toolchain the main code compiles with.
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew dokkaGeneratePublicationHtml

      # Copy KDocs into the Zensical site output
      - run: cp -r build/dokka/html website/prometheus-proxy/site/kdocs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/prometheus-proxy/site

  # Deploy the artifact produced by the build job. Deliberately minimal (no
  # checkout or build) so re-running just this job re-deploys the existing
  # artifact without rebuilding or re-uploading it.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
