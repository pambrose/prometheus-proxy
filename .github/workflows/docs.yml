name: Documentation
# The site deploys only with a release: `make release` starts a workflow_dispatch (`make gh-docs`) once it has
# published to Maven Central and Docker Hub and checked the images, and that run deploys master as the release left it.
# A push to master builds the site and the KDocs without deploying them, so the live site keeps describing the release
# its visitors can install, never features merged since; and the build is a check on each commit, which make
# release-check requires to have passed. Nothing else builds the KDocs before a release. To deploy master between
# releases, a fix the live site can't wait for, run `make gh-docs`: it deploys master as it is, unreleased pages
# included.
on:
  push:
    branches:
      - master
  workflow_dispatch:

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

# One run at a time per event, never cancelled. Pushes and deploys queue apart, so a push's build can't take the place
# of a deploy waiting in the queue, which a pending run in the same group would.
concurrency:
  group: pages-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # Build the docs site + KDocs and upload the Pages artifact. Kept separate from
  # the deploy job so that recovering a failed deploy means re-running only the
  # deploy job (via "Re-run failed jobs"), which does NOT re-upload the artifact.
  # actions/deploy-pages hard-fails when a run contains more than one artifact
  # named "github-pages", which is what re-running a combined build+deploy job did.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build the Zensical documentation site from website/uv.lock with `make build-site`, which CI's docs-site job
      # also runs on every pull request. uv reads website/.python-version and installs that Python itself.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Without a version, setup-uv installs the newest uv, so the deploy could change with no diff here. The same
          # uv as ci.yml's docs-site job (CiHygieneTest checks); update both with the uv website/uv.lock is locked with.
          version: "0.13.7"
      # mkdocs-material, which the emoji extension needs, is pinned in website/pyproject.toml and so in uv.lock.
      - run: make build-site

      # Build KDoc API documentation
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and the tests, matching the Docker runtime; JDK 17 is the
          # toolchain the main code compiles with.
          java-version: |
            17
            25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew dokkaGeneratePublicationHtml

      # Copy KDocs into the Zensical site output
      - run: cp -r build/dokka/html website/prometheus-proxy/site/kdocs

      # Only a run that deploys needs the artifact.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'workflow_dispatch'
        with:
          path: website/prometheus-proxy/site

  # Deploy the artifact produced by the build job. Deliberately minimal (no
  # checkout or build) so re-running just this job re-deploys the existing
  # artifact without rebuilding or re-uploading it. Only a workflow_dispatch
  # deploys (see the top of this file); a push only builds.
  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
