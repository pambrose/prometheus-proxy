name: zizmor

# Audits the GitHub Actions workflows and dependabot.yml with zizmor (https://docs.zizmor.sh): template injection,
# excessive permissions, persisted checkout credentials, unpinned or known-vulnerable actions, missing Dependabot
# cooldowns, and more. A pull request fails on any finding, which is annotated on the diff. Pushes to master, the weekly
# run, and manual runs upload the findings to the repository's code scanning alerts instead, so a new audit or a newly
# vulnerable action surfaces even when no workflow changed. `make zizmor` runs the same audit locally. No untrusted
# event payloads are referenced.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: a newer push to a pull request supersedes a run still in progress; other runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Annotation output exits non-zero on a finding, failing the check. It needs no write token, so fork and Dependabot
  # pull requests run it too.
  zizmor:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Keep in step with ZIZMOR_IMAGE in the Makefile.
          version: 1.30.1
          advanced-security: false
          annotations: true

  # SARIF output never fails the job: the findings become code scanning alerts.
  code-scanning:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Keep in step with ZIZMOR_IMAGE in the Makefile.
          version: 1.30.1
