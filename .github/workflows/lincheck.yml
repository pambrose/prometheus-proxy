name: Lincheck

# Runs the Lincheck concurrency specs (*LincheckTest, tagged Lincheck), which explore thread interleavings of the
# proxy's and agent's concurrent classes. They take several minutes, so the default test run and CI leave them out;
# this runs them on demand (Actions > Lincheck > Run workflow). No untrusted event payloads are referenced.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lincheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # JDK 25 (the last, so the default) runs Gradle and the tests, matching the Docker runtime; JDK 17 is the
          # toolchain the main code compiles with.
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run the Lincheck specs
        run: make lincheck-tests

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lincheck-test-reports
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
