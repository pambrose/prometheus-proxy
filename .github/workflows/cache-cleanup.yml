name: Cache Cleanup

# Deletes the GitHub Actions caches that no run can use again, so the repository stays under GitHub's 10 GB cache limit
# without its least-recently-used eviction reaching master's Gradle caches: every dated Trivy vulnerability database
# but the newest (trivy-action saves about 1 GB under a new cache-trivy-YYYY-MM-DD key each day it scans, and a scan
# never reads an older date), and the caches of closed pull requests (a pull request's cache is visible only to that
# pull request). Master's Gradle caches are left to setup-gradle and GitHub's 7-day eviction, since deleting them would
# make the next builds start cold. Runs weekly after the Monday Security and zizmor runs, so the database kept is the
# one that week's scan saved. A schedule rather than a pull request's closed event: pull_request gives Dependabot pull
# requests a read-only token, and pull_request_target is a trigger zizmor flags. No untrusted event payloads are
# referenced.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

# Two cleanups at once would race to delete the same caches.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # to list and delete caches
      pull-requests: read # to list the open pull requests
    # gh reads the repository from GH_REPO, so no checkout is needed.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    # An explicit bash runs with pipefail, so a failed listing fails the step instead of piping nothing to jq.
    defaults:
      run:
        shell: bash
    # Cache keys are untrusted: a fork's pull request run can save a cache under any key on its own ref. So the newest
    # Trivy database is chosen from master's caches only, and each cache is deleted by its numeric id, read from a
    # tab-separated record in which @tsv escapes any tab or newline in the key. A cache GitHub evicts between the
    # listing and the delete is reported as a warning, not a failure.
    steps:
      - name: Delete every Trivy database on master but the newest
        run: |
          caches=$(gh cache list --ref refs/heads/master --key cache-trivy- --limit 1000 --json id,key)
          newest=$(jq -r 'map(.key) | max // empty' <<< "$caches")
          echo "Keeping ${newest:-no Trivy database}"
          jq -r --arg newest "$newest" '.[] | select(.key != $newest) | [.id, .key] | @tsv' <<< "$caches" |
            while IFS=$'\t' read -r id key; do
              echo "Deleting $key ($id)"
              gh cache delete "$id" || echo "::warning::Could not delete $key ($id)"
            done

      - name: Delete the caches of closed pull requests
        run: |
          open=$(gh pr list --state open --limit 1000 --json number --jq 'map(.number)')
          echo "Open pull requests: $open"
          gh cache list --limit 1000 --json id,key,ref |
            jq -r --argjson open "$open" '
              .[] | . as $cache
              | .ref | capture("^refs/pull/(?<n>[0-9]+)/") | .n | tonumber
              | select(IN($open[]) | not)
              | [$cache.id, ., $cache.key] | @tsv' |
            while IFS=$'\t' read -r id pr key; do
              echo "Deleting $key ($id) of closed pull request #$pr"
              gh cache delete "$id" || echo "::warning::Could not delete $key ($id)"
            done
