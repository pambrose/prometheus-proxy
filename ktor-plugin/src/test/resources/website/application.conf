# The docs site's Ktor Plugin page shows this section, from its start marker to its end marker. KtorPluginExamplesTest
# starts an app with it.

# --8<-- [start:conf]
prometheus-proxy.agent {
  # Unset, as on a developer's machine, the agent stays off
  proxy = ${?PROMETHEUS_PROXY}
  token = ${?PROMETHEUS_AGENT_TOKEN}
  name = my-app
  # The proxy's path the app's registry is served at, and its labels in the proxy's service discovery
  path = my_app_metrics
  labels { team = web }
}
# --8<-- [end:conf]
