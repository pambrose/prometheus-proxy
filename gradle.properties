# Gradle settings
group=com.pambrose
version=4.7.0

# The POM metadata every published artifact shares, the agent's, the Spring Boot starter's, and the Ktor plugin's, which
# the Maven publish plugin reads from here; each project's build sets only its name and description.
POM_URL=https://github.com/pambrose/prometheus-proxy
POM_LICENSE_NAME=Apache License 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0
POM_DEVELOPER_ID=pambrose
POM_DEVELOPER_NAME=Paul Ambrose
POM_DEVELOPER_EMAIL=paul@pambrose.com
POM_SCM_URL=https://github.com/pambrose/prometheus-proxy
POM_SCM_CONNECTION=scm:git:git://github.com/pambrose/prometheus-proxy.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://github.com/pambrose/prometheus-proxy.git

kotlin.code.style=official
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
