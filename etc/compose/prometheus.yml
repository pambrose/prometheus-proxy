# Prometheus config for etc/compose/proxy.yml. Both targets are the proxy's scrape port; the metrics path selects
# which agent path the proxy forwards the scrape to.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: proxy
    metrics_path: /proxy_metrics
    static_configs:
      - targets: ["proxy:8080"]

  - job_name: agent
    metrics_path: /agent_metrics
    static_configs:
      - targets: ["proxy:8080"]
