// Agent config for etc/compose/proxy.yml. The proxy's address comes from PROXY_HOSTNAME in the compose file.

agent {
  name = "compose-agent"

  pathConfigs: [
    {
      name: "Proxy metrics"
      path: proxy_metrics
      // The proxy's metrics endpoint, reached by its service name on the compose network.
      url: "http://proxy:8082/metrics"
    }
    {
      name: "Agent metrics"
      path: agent_metrics
      // The agent's own metrics endpoint, inside its own container.
      url: "http://localhost:8083/metrics"
    }
  ]
}
