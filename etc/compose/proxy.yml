# Runs a proxy, an agent, and a Prometheus server that scrapes the proxy's and the agent's own metrics through
# the proxy. From the repository root:
#
#   docker compose -f etc/compose/proxy.yml up
#
# then open Prometheus at http://localhost:9090 and check that both targets are up under Status > Targets.
#
# Every port is published on this machine's 127.0.0.1 only, as nothing here asks for a token or a login, and the
# agents' gRPC port, 50051, not at all: the agent reaches the proxy over the compose network. In a real deployment the
# agent runs inside the firewall on another host, with PROXY_HOSTNAME set to the proxy, which then publishes 50051 and
# requires a token and TLS, as examples/cloud-proxy/docker-compose.yml does.

services:
  proxy:
    image: pambrose/prometheus-proxy:4.7.0
    ports:
      - "127.0.0.1:8080:8080"  # Scrape port, for Prometheus and curl
      - "127.0.0.1:8082:8082"  # Proxy metrics
      - "127.0.0.1:8092:8092"  # Admin endpoints (/ping, /healthcheck)
    environment:
      METRICS_ENABLED: "true"
      ADMIN_ENABLED: "true"
    restart: unless-stopped

  agent:
    image: pambrose/prometheus-agent:4.7.0
    ports:
      - "127.0.0.1:8083:8083"  # Agent metrics
      - "127.0.0.1:8093:8093"  # Admin endpoints
    environment:
      AGENT_CONFIG: /app/agent.conf
      PROXY_HOSTNAME: proxy
      METRICS_ENABLED: "true"
      ADMIN_ENABLED: "true"
    volumes:
      - ./agent.conf:/app/agent.conf:ro
    depends_on:
      - proxy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - proxy
    restart: unless-stopped
