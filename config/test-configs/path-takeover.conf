// Config for AgentPathTakeoverTest: agents with no static paths, which register the same exclusive path at runtime, so
// the later registration takes it over. The retry interval is long, so the displaced agent taking the path back within
// seconds of the other agent leaving shows the proxy's notice did it, not a retry.

proxy {
  internal.zipkin.enabled = false
}

agent {
  internal {
    zipkin.enabled = false
    rejectedPathRetrySecs = 60
    rejectedPathRetryMaxSecs = 120
  }
}
