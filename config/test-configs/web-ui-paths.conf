// Config for ProxyWebDashboardTest's path-centric layout test.
//
// Separate from web-ui.conf specifically because it registers a path: the other two tests in that spec
// assert on an empty proxy, and a registered path would change what they see.
//
// The URL is asserted on verbatim in the rendered table, so it must be distinctive. It deliberately
// names a host that can't resolve (.invalid, RFC 2606) -- registration carries the target URL to the
// proxy regardless of whether the target answers, and it is the registration path under test here, not
// the scrape. A localhost port could belong to another spec's server.

agent {
  name = "web-ui-path-agent"

  pathConfigs: [
    {
      name: path_table_target
      path: ui_path_metrics
      url: "http://ui-path-target.invalid/metrics"
    }]

  internal {
    reconnectPauseSecs = 1
  }
}

proxy {
  dashboard {
    refreshIntervalSecs = 1
  }
}
