// Config for ProxyWebDashboardTest's scrape-now test: an agent with one path, whose target is a stub the test serves on
// TestPorts.DASHBOARD_UI_SCRAPE_STUB_PORT. The port is fixed because a config file cannot see the test's ports.

proxy {
  dashboard {
    refreshIntervalSecs = 1
  }
}

agent {
  name = "web-ui-scrape-agent"

  pathConfigs: [
    {
      name: scrape_target
      path: ui_scrape_metrics
      url: "http://127.0.0.1:9738/metrics"
    }]

  internal {
    reconnectPauseSecs = 1
  }
}
