// Config for AgentRejectedPathRetryTest: two per-agent identities that may both register shared_* paths, and one agent
// config both agents load. Shared by the proxy (reads proxy.auth) and the agents (read agent.pathConfigs).

proxy {
  auth = [
    { name = team_a, token = "team-a-token", paths = ["shared_*", "a_*"] }
    { name = team_b, token = "team-b-token", paths = ["shared_*", "b_*"] }
  ]
}

agent {
  // shared_metrics is contested. Each agent can also register a path only its own identity may use, so a rejected
  // shared_metrics never leaves an agent with every static path rejected, which would fail its connection instead.
  pathConfigs = [
    { name = "shared", path = "shared_metrics", url = "http://localhost:9100/metrics", labels = "{}" }
    { name = "team a", path = "a_metrics", url = "http://localhost:9100/metrics", labels = "{}" }
    { name = "team b", path = "b_metrics", url = "http://localhost:9100/metrics", labels = "{}" }
  ]

  internal {
    // Short, so the retry is observable within the test's patience.
    rejectedPathRetrySecs = 1
  }
}
