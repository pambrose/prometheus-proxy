proxy {

  zipkin.enabled = false

  metrics {
    standardExportsEnabled = true
    memoryPoolsExportsEnabled = true
    garbageCollectorExportsEnabled = true
    threadExportsEnabled = true
    classLoadingExportsEnabled = true
    versionInfoExportsEnabled = true
  }
}

agent {

  zipkin.enabled = false

  metrics {
    standardExportsEnabled = true
    memoryPoolsExportsEnabled = true
    garbageCollectorExportsEnabled = true
    threadExportsEnabled = true
    classLoadingExportsEnabled = true
    versionInfoExportsEnabled = true
  }

  // This exercises a code path. The url is the harness proxy's metrics port (TestPorts.HARNESS_PROXY_METRICS_PORT),
  // not the product default, which a proxy already running on the machine holds.
  pathConfigs: [
    {
      name: agent1
      path: agent1_metrics
      url: "http://localhost:9508/metrics"
    }]

  // Exercises per-path metric filtering (Feature 4).
  filters: [
    {
      path: filtered_metrics
      metricNameAllow: []
      metricNameDeny: [ "go_.*" ]
    }]
}
