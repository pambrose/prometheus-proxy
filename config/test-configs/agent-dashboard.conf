// Config for AgentWebDashboardTest: an agent whose dashboard shows one path registered and another refused, which its
// identity's glob doesn't match, with a metric filter on the first. Shared by the proxy (reads proxy.auth) and the
// agent, like web-ui-identity.conf.
//
// The target names a host that can't resolve (.invalid, RFC 2606): registration carries the URL to the proxy whether
// or not the target answers, and it is the registration and the dashboard under test here, not the scrape.

proxy {
  auth = [
    { name = team_a, token = "agent-dashboard-team-a-token", paths = ["agent_dash_allowed_*"] }
  ]
}

agent {
  name = "agent-dashboard-agent"
  agentToken = "agent-dashboard-team-a-token"

  pathConfigs: [
    {
      name: allowed_target
      path: agent_dash_allowed_metrics
      url: "http://ops:s3cret@agent-dash-target.invalid/metrics"
    },
    {
      name: forbidden_target
      path: agent_dash_forbidden_metrics
      url: "http://agent-dash-target.invalid/metrics"
    }]

  filters: [
    { path: agent_dash_allowed_metrics, metricNameAllow: [], metricNameDeny: ["go_.*"] }
  ]

  dashboard {
    // Short so the push loop's tick is observable within a test's patience.
    refreshIntervalSecs = 1
  }

  internal {
    reconnectPauseSecs = 1
  }
}
