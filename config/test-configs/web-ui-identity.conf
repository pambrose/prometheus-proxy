// Config for ProxyWebDashboardTest's identity and search test: one per-agent identity, and an agent that connects as it
// and registers one path. Shared by the proxy (reads proxy.auth) and the agent, like web-ui-paths.conf.
//
// The target names a host that can't resolve (.invalid, RFC 2606): registration carries the URL to the proxy whether
// or not the target answers, and it is the registration and the dashboard under test here, not the scrape.

proxy {
  auth = [
    { name = team_a, token = "web-ui-team-a-token", paths = [] }
  ]

  dashboard {
    refreshIntervalSecs = 1
  }
}

agent {
  name = "web-ui-identity-agent"
  agentToken = "web-ui-team-a-token"

  pathConfigs: [
    {
      name: identity_target
      path: ui_identity_metrics
      url: "http://ui-identity-target.invalid/metrics"
    }]

  internal {
    reconnectPauseSecs = 1
  }
}
