// Config for ProxyScreensTest: web-ui.conf plus two screens, so the proxy serves /screens. A file rather than a -D
// override, because -D values parse with properties syntax and a list would arrive as a string.

include "web-ui.conf"

proxy {
  dashboard {
    screens = [
      { name = "agent-east", url = "http://agent-east.example.com:8095/dashboard" }
      { name = "Grafana", url = "http://grafana.example.com:3000", start = "/d/overview?kiosk" }
    ]
  }
}
