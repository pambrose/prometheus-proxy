// Config for AgentPathTakeoverTest's reconnect spec: path-takeover.conf, plus the shared path as a static path, which
// the agent registers again at every connect. The spec only checks which agent the proxy gives the path to, and never
// scrapes it, so its target is never fetched.

include "path-takeover.conf"

agent {
  pathConfigs = [
    {
      name = "Shared"
      path = takeover_shared_metrics
      url = "http://localhost:9100/metrics"
    }
  ]
}
