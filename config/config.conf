

proxy {
  agent.port = 50051                              // Listen port for agent connections

  transportFilterDisabled = false                 // Assign to true if using nginx as a reverse proxy

  reflectionDisabled = true                       // Assign to false to enable gRPC reflection

  agentToken = ""                                 // Pre-shared token agents must present; empty disables it (proxy.auth identities still apply)

  auth: [                                         // Per-agent identities; empty list disables per-agent auth
    {
      name: String                                // Identity name (required)
      token: String                               // Per-identity token agents present (required)
      paths = [ String ]                          // Allowed path glob patterns; empty list allows all paths
    }
  ]

  logLevel = ""                                   // Log level ("trace", "debug", "info", "warn", "error", "off")

  service.discovery {
    enabled = false                               // Enable service discovery
    path = "discovery"                            // Service discovery path
    targetPrefix = "localhost:8080"               // Service discovery target: host:port, or an http(s) URL
    reserveJobAndInstanceLabels = false           // Also drop agent-supplied job and instance labels (__* are always dropped)
  }

  http {
    port = 8080                                   // Listen port for proxied scrapes
    host = "0.0.0.0"                              // Listen address for proxied scrapes
    idleTimeoutSecs = 45                          // Seconds an idle scrape connection stays open (-1 = 45; 0 or another negative fails startup)
    requestLoggingEnabled = true                  // Log every proxy metrics request
  }

  admin {
    enabled = false                               // Enable Admin servlets
    port = 8092                                   // Admin servlets port
    pingPath = "ping"                             // Ping servlet path
    versionPath = "version"                       // Version servlet path
    healthCheckPath = "healthcheck"               // HealthCheck servlet path
    threadDumpPath = "threaddump"                 // ThreadDump servlet path
    debugEnabled = false                          // Enable proxy debug servlet on admin port
    recentRequestsQueueSize = 50                  // Size of queue for recent activities on debug servlet
  }

  dashboard {
    enabled = false                               // Enable the operational dashboard
    port = 8094                                   // Listen port for the dashboard
    path = "dashboard"                            // Base path for the dashboard
    host = "0.0.0.0"                              // Listen address; "127.0.0.1" keeps the dashboard local
    refreshIntervalSecs = 2                       // Push interval for values that drift rather than change (backlogs, map sizes, countdowns)
    pathHistorySize = 20                          // Most recent scrapes kept per path, for the path table's history strip and each agent's Recent scrapes
    departedPathRetentionSecs = 3600              // How long a path whose agent has gone stays in the path table
    activityLogSize = 500                         // Most lines kept in the activity feed of agents and paths coming, going, and refused
    scrapeNowEnabled = true                       // A Scrape button on each path, which scrapes it at once and shows the result
    maxSessions = 50                              // Max concurrent dashboard WebSocket sessions
    allowedOrigins = [ String ]                   // Browser origins allowed besides the dashboard's own host (e.g. behind a reverse proxy)
    allowedHosts = [ String ]                     // Host names the dashboard answers to, against DNS rebinding; empty disables the check
    framingEnabled = true                         // Lets any web page show the dashboard in a frame; false refuses framing on every response
    username = "admin"                            // The username of the dashboard's login, which password turns on
    password = ""                                 // Requires a login, username and this, from the dashboard's login page or as Basic Auth; empty leaves it open. Never logged
    links: [                                      // Links on each path into other tools (Prometheus, Grafana, runbooks); empty hides the Links column
      {
        name: String                              // Link text, such as "Grafana" (required)
        url: String                               // URL template: {path}, {agent}, {identity}, {label.<name>} (required)
        icon = ""                                 // Brand icon shown instead of the name: "prometheus" or "grafana"; empty shows the name
      }
    ]
  }

  tls {
    certChainFilePath = ""                        // Server certificate chain file path
    privateKeyFilePath = ""                       // Server private key file path
    trustCertCollectionFilePath = ""              // Trust certificate collection file path
    certChainPem = ""                             // Server certificate chain as PEM, or its base64, for the file path
    privateKeyPem = ""                            // Server private key as PEM, or its base64, for the file path
    trustCertCollectionPem = ""                   // Trust certificate collection as PEM, or its base64, for the file path
  }

  metrics {
    enabled = false                               // Enable Proxy metrics
    port = 8082                                   // Listen port for metrics endpoint
    path = "metrics"                              // Path for metrics endpoint

    standardExportsEnabled = false                // Include standard export metrics
    memoryPoolsExportsEnabled = false             // Include JVM memory pool metrics
    garbageCollectorExportsEnabled = false        // Include JVM garbage collector metrics
    threadExportsEnabled = false                  // Include JVM thread metrics
    classLoadingExportsEnabled = false            // Include JVM class loading metrics
    versionInfoExportsEnabled = false             // Include JVM version info metrics
    bufferPoolExportsEnabled = false              // Include JVM buffer pool (direct and mapped memory) metrics
    compilationExportsEnabled = false             // Include JVM JIT compilation time metrics
    nativeMemoryExportsEnabled = false            // Include JVM native memory metrics (needs -XX:NativeMemoryTracking)
  }

  grpc {
    handshakeTimeoutSecs = "long | -1"
    keepAliveTimeSecs = "long | -1"
    keepAliveTimeoutSecs = "long | -1"
    permitKeepAliveWithoutCalls = false
    permitKeepAliveTimeSecs = "long | -1"
    maxConnectionIdleSecs = "long | -1"
    maxConnectionAgeSecs = "long | -1"
    maxConnectionAgeGraceSecs = "long | -1"
  }

  internal {
    staleAgentCheckEnabled = true
    maxAgentInactivitySecs = 60                   // Seconds of inactivity before agent is evicted in seconds
    staleAgentCheckPauseSecs = 10                 // Pause interval for agent cleanup in seconds

    scrapeRequestTimeoutSecs = 90                 // Timeout for scrape requests in seconds
    scrapeRequestBacklogUnhealthySize = 25        // Unhealthy-healthcheck threshold; each agent's queue is capped at twice this (503 beyond it)
    scrapeRequestMapUnhealthySize = 0             // In-flight scrapes at which the healthcheck turns unhealthy (0 = 80% of maxInFlightScrapeRequests)
    maxInFlightScrapeRequests = 1000              // Max scrape requests in flight across all agents (503 beyond it)
    maxPathsPerAgent = 20000                      // Max paths one agent connection may register (0 = unlimited)
    maxPathsPerIdentity = 100000                  // Max paths the agents of one auth identity may register together; all share one with auth off or agentToken (0 = unlimited)
    maxPathLength = 512                           // Max characters in a registered path (0 = unlimited)
    maxLabelsSizeBytes = 8192                     // Max size of a path's labels JSON, in bytes (0 = unlimited)
    maxLabelsPerPath = 64                         // Max labels in a path's labels JSON object (0 = unlimited)
    maxAgentFieldLength = 256                     // Max characters kept of an agent's name, host name, launch ID, and each proxy endpoint (0 = unlimited)
    maxAgentProxyEndpoints = 16                   // Max entries kept of an agent's proxy endpoint list (0 = unlimited)
    maxTargetUrlLength = 2048                     // Max characters kept of a path's target URL, as the agent reports it (0 = unlimited)
    maxAgentsPerIdentity = 10000                  // With transportFilterDisabled, max agents connected as one auth identity; all share one with auth off or agentToken (0 = unlimited)
    streamKeepAliveSecs = 30                      // Seconds a stream between the proxy and an agent goes without a message before a keepalive, so a reverse proxy's idle timeout doesn't close it; keep it under that timeout (0 = off)

    chunkContextMapUnhealthySize = 0              // Chunked transfers at which the healthcheck turns unhealthy (0 = 80% of maxInFlightScrapeRequests)

    maxZippedContentSizeMBytes = 5                // Maximum allowed size of zipped content in megabytes
    maxUnzippedContentSizeMBytes = 10             // Maximum allowed size of unzipped content in megabytes

    zipkin {
      enabled = false
      hostname = "localhost"
      port = 9411
      path = "api/v2/spans"
      serviceName = "prometheus-proxy"
      sampleRate = "double | 1.0"                 // Fraction of scrapes and gRPC calls traced: 0, or 0.01 to 1 (never heartbeats or the path notices stream)
    }

    blitz {
      enabled = false
      path = "mu-dd4bffbb-ff2e9926-5a80952c-1c6cb64d.txt"
    }
  }
}

agent {
  name = ""                                       // Agent name used in metrics reporting

  transportFilterDisabled = false                 // Assign to true if using nginx as a reverse proxy

  consolidated = false

  agentToken = ""                                 // Pre-shared token presented to the Proxy; empty disables auth

  // See: https://github.com/grpc/grpc.github.io/issues/371
  chunkContentSizeKbs = 32                        // Threshold for chunking data to Proxy and buffer size
  minGzipSizeBytes = 512                          // Content over this many bytes, after the path's filter, is gzipped

  scrapeTimeoutSecs = 15                          // Scrape timeout time in seconds
  scrapeMaxRetries = 0                            // Maximum scrape retries (0 disables scrape retries)

  logLevel = ""                                   // Log level (trace, debug, info, warn, error, off)

  proxy {
    hostname = "localhost"                        // Proxy hostname; used when endpoints is empty
    port = 50051                                  // Proxy port; also the default port for endpoints entries without one
    endpoints = [ String ]                        // Ordered failover endpoints ("host[:port]"); empty falls back to hostname:port
  }

  http {
    enableTrustAllX509Certificates = false        // Enabling will disable SSL verification for agent https endpoints
    trustStorePath = ""                           // JKS/PKCS12 trust store for verifying HTTPS scrape targets (custom/private CA); empty uses the JDK default trust store
    trustStorePassword = ""                       // Password for trustStorePath (empty if the store has none)

    maxConcurrentClients = 1                      // Maximum number of scrapes the agent runs at once
    clientTimeoutSecs = 90                        // HTTP client timeout in seconds (replaces internal.cioTimeoutSecs)

    maxContentLengthMBytes = 10                   // Maximum allowed size of scrape response in megabytes

    clientCache {
      maxSize = 100                               // Maximum number of HTTP clients to cache
      maxAgeMins = 30                             // Maximum age of cached clients in minutes
      maxIdleMins = 10                            // Maximum idle time before client is evicted in minutes
      cleanupIntervalMins = 5                     // Interval between cache cleanup runs in minutes
    }
  }

  admin {
    enabled = false                               // Enable Admin servlets
    port = 8093                                   // Admin servlets port
    pingPath = "ping"                             // Ping servlet path
    versionPath = "version"                       // Version servlet path
    healthCheckPath = "healthcheck"               // HealthCheck servlet path
    threadDumpPath = "threaddump"                 // ThreadDump servlet path
    debugEnabled = false                          // Enable agent debug servlet on admin port
  }

  dashboard {
    enabled = false                               // Enable the agent's dashboard
    port = 8095                                   // Listen port for the dashboard
    path = "dashboard"                            // Base path for the dashboard
    host = "0.0.0.0"                              // Listen address; "127.0.0.1" keeps the dashboard local
    refreshIntervalSecs = 2                       // Push interval for values that drift rather than change (uptime, backlog, retry countdowns)
    pathHistorySize = 20                          // Most recent scrapes kept per path, for each path's history strip and Recent scrapes
    scrapeNowEnabled = true                       // A Scrape now button on each path, which scrapes its target from the agent at once and shows the result
    activityLogSize = 500                         // Most lines kept in the activity feed of the agent's connection, paths, discovery, and filters
    maxSessions = 50                              // Max concurrent dashboard WebSocket sessions
    allowedOrigins = [ String ]                   // Browser origins allowed besides the dashboard's own host (e.g. behind a reverse proxy)
    allowedHosts = [ String ]                     // Host names the dashboard answers to, against DNS rebinding; empty disables the check
    framingEnabled = true                         // Lets any web page show the dashboard in a frame; false refuses framing on every response
    username = "admin"                            // The username of the dashboard's login, which password turns on
    password = ""                                 // Requires a login, username and this, from the dashboard's login page or as Basic Auth; empty leaves it open. Never logged
  }

  tls {
    overrideAuthority = ""                        // Override authority
    certChainFilePath = ""                        // Client certificate chain file path
    privateKeyFilePath = ""                       // Client private key file path
    trustCertCollectionFilePath = ""              // Trust certificate collection file path
    certChainPem = ""                             // Client certificate chain as PEM, or its base64, for the file path
    privateKeyPem = ""                            // Client private key as PEM, or its base64, for the file path
    trustCertCollectionPem = ""                   // Trust certificate collection as PEM, or its base64, for the file path
  }

  metrics {
    enabled = false                               // Enable Agent metrics
    port = 8083                                   // Listen port for metrics endpoint
    path = "metrics"                              // Path for metrics endpoint

    // The proxy path the agent serves its own metrics at, read in-process, with no port; empty for none
    proxyPath = ""
    proxyPathLabels = "{}"                        // The proxy path's labels as JSON, as a pathConfigs entry's

    standardExportsEnabled = false                // Include standard export metrics
    memoryPoolsExportsEnabled = false             // Include JVM memory pool metrics
    garbageCollectorExportsEnabled = false        // Include JVM garbage collector metrics
    threadExportsEnabled = false                  // Include JVM thread metrics
    classLoadingExportsEnabled = false            // Include JVM class loading metrics
    versionInfoExportsEnabled = false             // Include JVM version info metrics
    bufferPoolExportsEnabled = false              // Include JVM buffer pool (direct and mapped memory) metrics
    compilationExportsEnabled = false             // Include JVM JIT compilation time metrics
    nativeMemoryExportsEnabled = false            // Include JVM native memory metrics (needs -XX:NativeMemoryTracking)
  }

  discovery {                                     // Dynamic target discovery (reconcile paths at runtime)
    enabled = false                               // Enable dynamic discovery
    file.path = ""                                // Path to a HOCON/JSON file listing discovered paths
    reconcileIntervalSecs = 30                    // Poll and full-resync interval in seconds
  }

  pathConfigs: [                                  // List of path configs registered with a Proxy
    {
      name: String                                // Endpoint name
      path: String                                // Path used by the proxy
      url: String                                 // URL accessed by the Agent
      labels = "{}"                               // Endpoint labels as JSON
    }
  ]

  filters: [                                      // Per-path metric filters; empty list disables filtering
    {
      path: String                                // pathConfigs path this filter applies to (required)
      metricNameAllow = [ String ]                // Fully-anchored regexes; empty list allows all families
      metricNameDeny = [ String ]                 // Fully-anchored regexes; applied after allow
    }
  ]

  grpc {
    keepAliveTimeSecs = "long | -1"
    keepAliveTimeoutSecs = "long | -1"
    keepAliveWithoutCalls = false
    unaryDeadlineSecs = 30                        // Deadline for unary RPCs in seconds
  }

  internal {
    cioTimeoutSecs = 90                           // Deprecated for http.clientTimeoutSecs; used only when changed while that stays at its default

    reconnectPauseSecs = 3                        // Pause interval between connect attempts in seconds

    rejectedPathRetrySecs = 10                    // Wait before retrying a static path the proxy rejected as retryable, in seconds; doubles per repeat, up to rejectedPathRetryMaxSecs

    rejectedPathRetryMaxSecs = 300                // Longest wait between retries of a path the proxy rejected as retryable, in seconds; at or below a loop's interval, that loop retries every tick

    heartbeatEnabled = true
    heartbeatCheckPauseMillis = 500               // Pause interval when checking for inactivity
    heartbeatMaxInactivitySecs = 5                // Max inactivity before heartbeat sent in seconds

    scrapeRequestBacklogUnhealthySize = 25        // Threshold for returning an unhealthy healthcheck; the agent's scrape request queue holds twice this

    zipkin {
      enabled = false
      hostname = "localhost"
      port = 9411
      path = "api/v2/spans"
      serviceName = "prometheus-agent"
      sampleRate = "double | 1.0"                 // Fraction of scrapes and gRPC calls traced: 0, or 0.01 to 1 (never heartbeats or the path notices stream)
    }
  }
}
