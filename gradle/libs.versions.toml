[versions]
# Toolchain
gradle-wrapper = "9.9.1"
jvm = "17"
# The JVM the tests run on: the runtime the Docker images ship (main code still compiles for `jvm`)
testJvm = "25"

# Kotlin
kotlin = "2.4.21"
serialization = "1.13.0"

# Build plugins
config = "6.1.2"
detekt = "2.0.0-alpha.6"
dokka = "2.3.0"
gradle-plugins = "1.1.9"
# 0.9.10 or later: 0.9.9 gave a report variant built in the same Gradle run as another the other's filters, so the
# per-class check (koverVerifyPerClass) had to run in its own invocation.
kover = "0.9.11"
maven-publish = "0.37.0"
protobuf = "0.10.1"
shadow = "9.6.1"
taskinfo = "3.1.0"
versions = "0.67.0"

# gRPC / Protobuf
grpc = "1.85.1"
gengrpc = "1.5.0"
# protoc, protobuf-kotlin, protobuf-java, and protobuf-java-util, at one version. Ahead of the protobuf-java grpc-java
# depends on (3.25.9 for grpc 1.85.1, still on protobuf 3.x): grpc's own generated classes, such as grpc-services'
# reflection messages, run on the 4.x runtime, which accepts code generated by protoc 3.0.0 and later since 4.33. The
# code protoc 4.x generates needs a 4.x runtime at least as new, so the `protobuf` bundle declares protobuf-java and
# protobuf-java-util directly, and the published POM pins them for builds that embed the agent: Maven would otherwise
# choose between this version and grpc's 3.25.9 by declaration order. `make consumer-check` checks what Maven resolves.
protoc = "4.36.2"
# Ahead of the netty-tcnative grpc-java is built and tested with (2.0.81.Final for grpc 1.84.x and 1.85.x, per its
# SECURITY.md) for the native fixes in 2.0.82-2.0.85, among them a use-after-free on session-key rotation, NUL bytes
# accepted in SNI names, and an out-of-bounds read in ALPN protocol selection. 2.0.85.Final is the version Netty
# 4.2.20.Final, below, is built against. tcnative 2.0.x keeps its API stable, so grpc and Netty work with it unchanged.
# Go back to tracking grpc's version once it reaches 2.0.85.Final or later. common-utils' grpc-utils also brings
# tcnative, with its per-platform natives; build.gradle.kts declares the classes and every native at this version.
tcnative = "2.0.85.Final"
# grpc-netty 1.85.1 brings Netty 4.2.17.Final, which has CVE-2026-93492 (HTTP/2 HPACK encoder DoS) and the other
# advisories 4.2.18.Final, 4.2.19.Final, and 4.2.20.Final fix. build.gradle.kts raises every Netty module except
# netty-tcnative (pinned above) to this release, and declares them through the `netty` bundle so the published POM pins
# it for embedders too. Drop the override and the bundle once grpc brings 4.2.20.Final or later.
netty = "4.2.20.Final"

# Ktor
ktor = "3.6.1"

# WebJars (htmx client assets, served from the classpath -- no CDN, works airgapped).
# htmx 4 ships its WebSocket extension in this same WebJar (dist/ext/hx-ws.min.js), so there is no separate
# htmx-ext-ws dependency. ProxyDashboardService reads the version through BuildConfig, so both the classpath paths it
# reads and the URLs it serves the assets at follow it. A major bump means porting ProxyDashboardHtml's page shell
# and script (attributes, event names, the WebSocket config), not just the version.
htmx = "4.0.1"

# Metrics
# The version common-utils 5.2.0 is built against. build.gradle.kts imports this BOM so the Prometheus modules
# common-utils brings (JVM instrumentation, exposition formats, exporters) resolve to the same version as
# prometheus-metrics-core, even when this one moves ahead of common-utils.
prometheus = "1.10.0"
dropwizard = "4.2.40"
# Dropwizard metrics-json (common-utils' service-utils) brings Jackson 2.12.7, which has CVE-2025-52999 and
# CVE-2026-54512/54513 (high). build.gradle.kts imports this BOM to raise it, and declares the `jackson` bundle at this
# version so the published POM raises it for Maven builds that embed the agent too. jackson-annotations has had no patch
# number since 2.20, so its version is jackson's major.minor, which build.gradle.kts checks.
jackson = "2.23.0"
jacksonAnnotations = "2.23"

# Tracing
zipkin = "6.3.1"

# Logging
logging = "8.0.7"
logback = "1.6.7"
slf4j = "2.0.20"

# Config / CLI
typesafe = "1.4.10"
jcommander = "3.0"

# Common Utils
utils = "5.2.0"

# Misc
annotation = "1.3.2"

# Testing
# YAML parser for tests (grafana/alerts.yml). Only the tests use this version: the fat JARs keep the 0.79.0 that
# Ktor's OpenAPI module brings.
kaml = "0.104.0"
kotest = "6.2.7"
lincheck = "3.7"
mockk = "1.14.12"
testcontainers = "2.0.5"

[libraries]
# Kotlin
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# gRPC / Protobuf
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "gengrpc" }
netty-tcnative = { module = "io.netty:netty-tcnative-boringssl-static", version.ref = "tcnative" }
# The Netty modules grpc-netty brings, at the patched `netty` version; see build.gradle.kts
netty-buffer = { module = "io.netty:netty-buffer", version.ref = "netty" }
netty-codec-base = { module = "io.netty:netty-codec-base", version.ref = "netty" }
netty-codec-compression = { module = "io.netty:netty-codec-compression", version.ref = "netty" }
netty-codec-http = { module = "io.netty:netty-codec-http", version.ref = "netty" }
netty-codec-http2 = { module = "io.netty:netty-codec-http2", version.ref = "netty" }
netty-codec-socks = { module = "io.netty:netty-codec-socks", version.ref = "netty" }
netty-common = { module = "io.netty:netty-common", version.ref = "netty" }
netty-handler = { module = "io.netty:netty-handler", version.ref = "netty" }
netty-handler-proxy = { module = "io.netty:netty-handler-proxy", version.ref = "netty" }
netty-resolver = { module = "io.netty:netty-resolver", version.ref = "netty" }
netty-transport = { module = "io.netty:netty-transport", version.ref = "netty" }
netty-transport-native-unix-common = { module = "io.netty:netty-transport-native-unix-common", version.ref = "netty" }
protobuf-kotlin = { module = "com.google.protobuf:protobuf-kotlin", version.ref = "protoc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protoc" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protoc" }

# Ktor
ktor-client = { module = "io.ktor:ktor-client", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }
ktor-network = { module = "io.ktor:ktor-network", version.ref = "ktor" }
ktor-network-tls = { module = "io.ktor:ktor-network-tls", version.ref = "ktor" }
ktor-server = { module = "io.ktor:ktor-server", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-compression = { module = "io.ktor:ktor-server-compression", version.ref = "ktor" }
ktor-server-html-builder = { module = "io.ktor:ktor-server-html-builder", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }

# WebJars
webjar-htmx = { module = "org.webjars.npm:htmx.org", version.ref = "htmx" }

# Metrics
prometheus-metrics-bom = { module = "io.prometheus:prometheus-metrics-bom", version.ref = "prometheus" }
prometheus-metrics-core = { module = "io.prometheus:prometheus-metrics-core", version.ref = "prometheus" }
dropwizard-metrics = { module = "io.dropwizard.metrics:metrics-healthchecks", version.ref = "dropwizard" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
# The Jackson modules Dropwizard metrics-json brings, at the patched `jackson` version; see build.gradle.kts
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jacksonAnnotations" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

# Tracing
zipkin-brave = { module = "io.zipkin.brave:brave-instrumentation-grpc", version.ref = "zipkin" }

# Logging
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "logging" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
slf4j-jul = { module = "org.slf4j:jul-to-slf4j", version.ref = "slf4j" }

# Config / CLI
typesafe-config = { module = "com.typesafe:config", version.ref = "typesafe" }
jcommander = { module = "org.jcommander:jcommander", version.ref = "jcommander" }

# Common Utils
common-utils-core = { module = "com.pambrose.common-utils:core-utils", version.ref = "utils" }
common-utils-dropwizard = { module = "com.pambrose.common-utils:dropwizard-utils", version.ref = "utils" }
common-utils-guava = { module = "com.pambrose.common-utils:guava-utils", version.ref = "utils" }
common-utils-grpc = { module = "com.pambrose.common-utils:grpc-utils", version.ref = "utils" }
common-utils-jetty = { module = "com.pambrose.common-utils:jetty-utils", version.ref = "utils" }
common-utils-ktor-client = { module = "com.pambrose.common-utils:ktor-client-utils", version.ref = "utils" }
common-utils-prometheus = { module = "com.pambrose.common-utils:prometheus-utils", version.ref = "utils" }
common-utils-service = { module = "com.pambrose.common-utils:service-utils", version.ref = "utils" }
common-utils-zipkin = { module = "com.pambrose.common-utils:zipkin-utils", version.ref = "utils" }

# Misc
annotation-api = { module = "javax.annotation:javax.annotation-api", version.ref = "annotation" }

# Testing
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
kotest = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
lincheck = { module = "org.jetbrains.lincheck:lincheck", version.ref = "lincheck" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[bundles]
grpc = [
  "grpc-protobuf",
  "grpc-stub",
  "grpc-services"
]

ktor = [
  "ktor-client",
  "ktor-client-cio",
  "ktor-client-auth",
  "ktor-network",
  "ktor-network-tls",
  "ktor-server",
  "ktor-server-cio",
  "ktor-server-call-logging",
  "ktor-server-compression",
  "ktor-server-html-builder",
  "ktor-server-websockets"
]

netty = [
  "netty-buffer",
  "netty-codec-base",
  "netty-codec-compression",
  "netty-codec-http",
  "netty-codec-http2",
  "netty-codec-socks",
  "netty-common",
  "netty-handler",
  "netty-handler-proxy",
  "netty-resolver",
  "netty-transport",
  "netty-transport-native-unix-common"
]

# Pinned at protoc's version for builds that embed the agent; see `protoc` above.
protobuf = [
  "protobuf-java",
  "protobuf-java-util"
]

jackson = [
  "jackson-annotations",
  "jackson-core",
  "jackson-databind"
]

webjars = [
  "webjar-htmx"
]

# Not common-utils-service, which build.gradle.kts declares as api, since the public Agent and Proxy extend its
# GenericService.
common-utils = [
  "common-utils-core",
  "common-utils-dropwizard",
  "common-utils-guava",
  "common-utils-grpc",
  "common-utils-jetty",
  "common-utils-ktor-client",
  "common-utils-prometheus",
  "common-utils-zipkin"
]

[plugins]
# Kotlin
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Build / packaging
ben-manes-versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version.ref = "config" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
taskinfo = { id = "org.barfuin.gradle.taskinfo", version.ref = "taskinfo" }

# Quality / coverage
detekt = { id = "dev.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Docs / publishing
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }

# pambrose convention plugins
pambrose-envvar = { id = "com.pambrose.envvar", version.ref = "gradle-plugins" }
pambrose-kotlinter = { id = "com.pambrose.kotlinter", version.ref = "gradle-plugins" }
pambrose-testing = { id = "com.pambrose.testing", version.ref = "gradle-plugins" }
