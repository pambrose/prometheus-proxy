syntax = "proto3";

import public "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "io.prometheus.grpc";

message RegisterAgentRequest {
  string agent_id = 1;
  string launch_id = 2;
  string agent_name = 3;
  string host_name = 4;
  reserved 5;
  bool consolidated = 6;
  // The agent's configured failover endpoints, in priority order, and which one this connection is
  // using. Reported at registration because that is exactly when it changes -- a failover IS a
  // reconnect, so the index is accurate whenever the proxy learns it. Both are additive and optional:
  // an agent predating them simply leaves them unset.
  repeated string proxy_endpoints = 7;
  int32 current_endpoint_index = 8;
  // Whether the agent reads readPathNoticesFromProxy, and so can be told that another agent took a path over and when
  // that path is free again. Additive both ways: a proxy keeps no notices for an agent predating it, which leaves it
  // false, and a proxy predating it ignores it.
  bool path_notices = 9;
}

message RegisterAgentResponse {
  bool valid = 1;
  string reason = 2;
  string agent_id = 3;
  // 4 was proxy_url: declared but never read or written anywhere, and easy to mistake for a
  // server-driven redirect mechanism that does not exist. Agent-side proxy failover is driven by the
  // agent's own endpoint list (agent.proxy.endpoints), not by the proxy. Reserved so the number and
  // name can never be reused with different semantics.
  reserved 4;
  reserved "proxy_url";
}

message RegisterPathRequest {
  string agent_id = 1;
  string path = 2;
  string labels = 3;
  // What the agent actually scrapes for this path, and where the registration came from. Both are
  // agent-side facts the proxy cannot otherwise learn, and both are what let the path-centric dashboard
  // answer "why isn't this target scraping?" without a second window. Additive and optional: an agent
  // predating them leaves them empty and the dashboard renders a dash.
  string target_url = 4;
  // A PathSource name -- STATIC or DISCOVERED. Carried as a string rather than an enum so an agent
  // running ahead of the proxy can add a source without the proxy failing to parse it.
  string path_source = 5;
  // Register the path only if no live agent of another launch serves it: an agent sends it for a path the proxy told
  // it was taken over, so it takes the path back once the other agent leaves, never from it while it stays. A proxy
  // predating it ignores it, which is why an agent sends it only after that proxy sent it a notice.
  bool reclaim = 6;
}

message RegisterPathResponse {
  bool valid = 1;
  string reason = 2;
  int32 path_count = 3;
  int64 path_id = 4;
  // Why the proxy rejected the path; REJECTION_CAUSE_UNSPECIFIED when valid.
  PathRejectionCause rejection_cause = 5;
}

// Why the proxy rejected a registerPath. The proxy reports the cause, and the agent decides from it whether a retry
// can succeed while it stays connected, treating a cause it doesn't recognize as one that can't.
enum PathRejectionCause {
  // No cause: the path was accepted, or the proxy predates the field.
  REJECTION_CAUSE_UNSPECIFIED = 0;
  // A live agent of another identity serves the path. Clears once that agent leaves.
  HELD_BY_ANOTHER_IDENTITY = 1;
  // The path's agents are consolidated and this one isn't, or the reverse. Clears once they leave.
  CONSOLIDATION_MISMATCH = 2;
  // The agent's identity isn't authorized for the path.
  NOT_AUTHORIZED = 3;
  // The path can't be registered as given, such as a multi-segment path.
  INVALID_PATH = 4;
  // The agent's context is missing or invalidated: its connection is going away.
  INVALID_AGENT = 5;
  // The request's agentId isn't the connection's, or its context is bound to another identity.
  BINDING_MISMATCH = 6;
  // The agent already registered proxy.internal.maxPathsPerAgent paths on this connection. Clears only as it frees
  // paths, so an agent doesn't retry it.
  PATH_LIMIT_REACHED = 7;
  // The registration was a reclaim, and a live agent of another launch serves the path. Clears once that agent leaves.
  HELD_BY_ANOTHER_AGENT = 8;
}

message UnregisterPathRequest {
  string agent_id = 1;
  string path = 2;
}

message UnregisterPathResponse {
  bool valid = 1;
  string reason = 2;
}

message PathMapSizeRequest {
  string agent_id = 1;
}

message PathMapSizeResponse {
  int32 path_count = 1;
}

message AgentInfo {
  string agent_id = 1;
}

// What the proxy tells an agent about a path it took from it: that another agent holds it now, or, with both held_by
// fields empty, that no agent serves it any more. A notice is the path's current state, not an event, so a later one
// for the same path replaces an earlier one the agent hasn't read yet.
message PathNotice {
  // The path, without its leading slash.
  string path = 1;
  string held_by_agent_id = 2;
  string held_by_agent_name = 3;
}

message ScrapeRequest {
  string agent_id = 1;
  int64 scrape_id = 2;
  string path = 3;
  string accept = 4;
  bool debug_enabled = 5;
  string encodedQueryParams = 6;
  string authHeader = 7;
  // How long the scraping client will wait, in milliseconds, from Prometheus's X-Prometheus-Scrape-Timeout-Seconds
  // header. 0 means the client sent none, and the agent uses only its own scrapeTimeoutSecs.
  int64 scrape_timeout_millis = 8;
  // Whether someone asked for the scrape from the proxy's dashboard (its scrape-now) rather than Prometheus. The agent
  // counts such a scrape in agent_dashboard_scrapes_total instead of its agent_scrape_* metrics, so those stay a record
  // of Prometheus's scrapes. Additive both ways: an agent predating it ignores it and counts the scrape as
  // Prometheus's, and a proxy predating it leaves it false.
  bool dashboard_scrape = 9;
  // The proxy's trace of the scrape, as B3 propagation headers, so the agent's span of its fetch joins it. Empty when
  // the proxy traces nothing, and then the agent, with its own tracing on, starts a trace of its own. Additive both
  // ways: an agent predating it ignores it, and a proxy predating it leaves it empty.
  map<string, string> trace_context = 10;
}

message ScrapeResponse {
  bool valid_response = 1;
  string agent_id = 2;
  int64 scrape_id = 3;
  int32 status_code = 4;
  string failure_reason = 5;
  string url = 6;
  string content_type = 7;
  bool zipped = 8;
  oneof content_one_of {
    string content_as_text = 9;
    bytes content_as_zipped = 10;
  }
}

message ChunkedScrapeResponse {
  oneof chunk_one_of {
    // Changes to the field names meta, data, and summary are hard-coded in the impl code
    HeaderData header = 1;
    ChunkData chunk = 2;
    SummaryData summary = 3;
  }
}

message HeaderData {
  bool header_valid_response = 1;
  string header_agent_id = 2;
  int64 header_scrape_id = 3;
  int32 header_status_code = 4;
  string header_failure_reason = 5;
  string header_url = 6;
  string header_content_type = 7;
  bool header_zipped = 8;
}

message ChunkData {
  int64 chunk_scrape_id = 1;
  int32 chunk_count = 2;
  int32 chunk_byte_count = 3;
  int64 chunk_checksum = 4;
  bytes chunk_bytes = 5;
}

message SummaryData {
  int64 summary_scrape_id = 1;
  int32 summary_chunk_count = 2;
  int32 summary_byte_count = 3;
  int64 summary_checksum = 4;
}

message HeartBeatRequest {
  string agent_id = 1;
}

message HeartBeatResponse {
  bool valid = 1;
  string reason = 2;
}

service ProxyService {
  rpc connectAgent (google.protobuf.Empty) returns (google.protobuf.Empty) {
  }

  rpc connectAgentWithTransportFilterDisabled (google.protobuf.Empty) returns (AgentInfo) {
  }

  rpc registerAgent (RegisterAgentRequest) returns (RegisterAgentResponse) {
  }

  rpc registerPath (RegisterPathRequest) returns (RegisterPathResponse) {
  }

  rpc unregisterPath (UnregisterPathRequest) returns (UnregisterPathResponse) {
  }

  rpc pathMapSize (PathMapSizeRequest) returns (PathMapSizeResponse) {
  }

  rpc readRequestsFromProxy (AgentInfo) returns (stream ScrapeRequest) {
  }

  rpc writeResponsesToProxy (stream ScrapeResponse) returns (google.protobuf.Empty) {
  }

  rpc writeChunkedResponsesToProxy (stream ChunkedScrapeResponse) returns (google.protobuf.Empty) {
  }

  rpc sendHeartBeat (HeartBeatRequest) returns (HeartBeatResponse) {
  }

  // The notices about paths another agent took from this one, for the connection's lifetime. Only an agent that sent
  // path_notices at registration calls it; a proxy predating it answers UNIMPLEMENTED.
  rpc readPathNoticesFromProxy (AgentInfo) returns (stream PathNotice) {
  }
}

