proxy {
  http {}

  // allowedOrigins and allowedHosts must be defaulted here for the same reason as agent.proxy.endpoints below: tscfg
  // generates an unguarded c.getList(...) for each, so a config that omits one would throw ConfigException.Missing.
  dashboard {
    allowedOrigins = []
    allowedHosts = []
  }

  agent {}

  auth = []

  admin {}

  metrics {}

  internal {
    zipkin {}
    blitz {}
  }
}

agent {
  // endpoints must be defaulted here: tscfg generates an unguarded c.getList("endpoints"), so a config
  // that omits it (i.e. every config written before failover existed) would throw ConfigException.Missing.
  proxy { endpoints = [] }

  http {}

  admin {}

  metrics {}

  pathConfigs: []

  filters: []

  internal {
    zipkin {}
  }
}