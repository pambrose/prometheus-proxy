proxy {
  http {}

  // allowedOrigins must be defaulted here for the same reason as agent.proxy.endpoints below: tscfg generates an
  // unguarded c.getList("allowedOrigins"), so a config that omits it would throw ConfigException.Missing.
  dashboard { allowedOrigins = [] }

  agent {}

  auth = []

  admin {}

  metrics {
    grpc {}
  }

  internal {
    zipkin {}
    blitz {}
  }
}

agent {
  // endpoints must be defaulted here: tscfg generates an unguarded c.getList("endpoints"), so a config
  // that omits it (i.e. every config written before failover existed) would throw ConfigException.Missing.
  proxy { endpoints = [] }

  http {}

  admin {}

  metrics {
    grpc {}
  }

  pathConfigs: []

  filters: []

  internal {
    zipkin {}
  }
}